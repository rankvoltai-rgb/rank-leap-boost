<!doctype html>
<!--
  Rankbox horizontal logo (mark + wordmark) on a transparent background, for
  the directories that ask for a "logo" as well as an icon. Sized in vh so
  ../render.sh can render it at any height; the width is 4x the height.

  ?v=ink    blue mark, near-black wordmark. For light pages.
  ?v=white  white mark and wordmark. For dark or blue pages.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Plus Jakarta Sans";
        src: url("./plus-jakarta-sans.woff2") format("woff2-variations");
        font-weight: 200 800;
        font-style: normal;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
      body {
        font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: geometricPrecision;
      }
      /* Same proportions as the lockup on the share card: a 36px mark beside
         29px/800 type with an 11px gap, scaled to the canvas height. */
      .lockup {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14vh;
        width: 100vw;
        height: 100vh;
        color: #0a0a0b;
      }
      .lockup svg { width: 46vh; height: 46vh; color: #1877f2; flex: none; }
      .wordmark {
        font-size: 37vh;
        font-weight: 800;
        letter-spacing: -0.025em;
        line-height: 1;
        /* Optical centre: the wordmark has no descenders, so nudge it down
           to sit on the mark's midline rather than the line box's. */
        transform: translateY(1.5vh);
      }
      body.white .lockup,
      body.white .lockup svg { color: #fff; }
    </style>
  </head>
  <body>
    <div class="lockup">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M2.6 2.6 Q12 6.9 21.4 2.6 Q17.1 12 21.4 21.4 Q12 17.1 2.6 21.4 Q6.9 12 2.6 2.6 Z"
          fill="currentColor"
          stroke="currentColor"
          stroke-width="1.4"
          stroke-linejoin="round"
        />
      </svg>
      <span class="wordmark">Rankbox</span>
    </div>
    <script>
      const v = new URLSearchParams(location.search).get("v") || "ink";
      if (v !== "ink") document.body.classList.add(v);
    </script>
  </body>
</html>
