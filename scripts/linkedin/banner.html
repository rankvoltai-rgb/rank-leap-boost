<!doctype html>
<!--
  Rankbox LinkedIn company page banner — 1128x191, rendered to ./out by
  ./render.sh. Edit here, re-render, never hand-edit the PNG.

  1128x191 is LinkedIn's company page cover size. Two things shape the
  layout and neither is negotiable:

    1. The page logo sits over the banner's bottom-left corner — roughly
       x 24-144, from y 130 down. Nothing may live there.
    2. At 5.9:1 the banner is a band, not a canvas. One line of promise,
       one line of proof, and a great deal of empty field. Adding a third
       element is what makes a banner look cheap.

  Everything here is the landing hero's own language: the brand-blue field,
  the drifting white pixel squares, the mark, and the hero's promise in the
  hero's words. Open ./banner.html?v=<variant>&guides=1 in a browser to see
  the logo dead zone drawn over the art.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Plus Jakarta Sans";
        src: url("./plus-jakarta-sans.woff2") format("woff2-variations");
        font-weight: 200 800;
        font-style: normal;
      }

      :root {
        --brand-blue: #1877f2;
        --hero-black: #0a0a0b;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body { width: 1128px; height: 191px; overflow: hidden; }

      body {
        font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: geometricPrecision;
      }

      .banner {
        position: relative;
        display: flex;
        align-items: center;
        width: 1128px;
        height: 191px;
        overflow: hidden;
        background: var(--brand-blue);
      }

      /* Light thrown from the upper left, deepening to the lower right. The
         hero is a flat field; a still image needs the falloff or the blue
         reads as a swatch. */
      .field {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(90% 180% at 8% 0%, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0) 58%),
          radial-gradient(70% 160% at 96% 100%, rgba(9, 48, 105, 0.5) 0%, rgba(9, 48, 105, 0) 62%);
      }

      /* The drifting pixel squares, held to the margins and the thin bands
         above and below the type — never across the words. */
      .pixels { position: absolute; inset: 0; }
      .pixels i {
        position: absolute;
        display: block;
        background: #fff;
        border-radius: 1px;
      }

      /* Starts clear of the page logo (x 24-144) with room to breathe. */
      .copy { position: relative; margin-left: 190px; }

      h1 {
        font-size: 39px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.022em;
        color: #fff;
        white-space: nowrap;
      }

      p {
        margin-top: 14px;
        font-size: 14.5px;
        font-weight: 500;
        letter-spacing: 0.004em;
        color: rgba(255, 255, 255, 0.7);
        white-space: nowrap;
      }

      /* The mark, alone on the right, balancing the type across the open
         middle. Sized to the logo it sits above without matching it. */
      .mark {
        position: absolute;
        top: 50%;
        right: 92px;
        width: 88px;
        height: 88px;
        transform: translateY(-50%);
        color: #fff;
      }
      .mark svg { display: block; width: 100%; height: 100%; }

      /* ---- variant: ink ----
         The rail's rule, applied to the banner: a near-black field where the
         blue is spent exactly once, on the mark. Reads as the sharpest thing
         on LinkedIn's white page. */
      body.ink .banner { background: var(--hero-black); }
      body.ink .field {
        background:
          radial-gradient(60% 150% at 86% 50%, rgba(24, 119, 242, 0.22) 0%, rgba(24, 119, 242, 0) 70%),
          radial-gradient(80% 170% at 6% 0%, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0) 60%);
      }
      body.ink .pixels i { opacity: var(--ink-opacity) !important; }
      body.ink p { color: rgba(255, 255, 255, 0.6); }
      body.ink .mark { color: var(--brand-blue); }

      /* ---- variant: open ----
         No mark. The right two-fifths is nothing but field. The most
         confident of the three, and the one that needs the page logo
         underneath to carry the brand. */
      body.open .mark { display: none; }

      /* The page logo's footprint, for checking collisions. Never rendered
         into the PNG — ?guides=1 only. */
      .guide {
        position: absolute;
        left: 24px;
        top: 130px;
        width: 120px;
        height: 61px;
        border: 1px dashed rgba(255, 0, 90, 0.9);
        display: none;
      }
      body.guides .guide { display: block; }
    </style>
  </head>
  <body>
    <div class="banner">
      <div class="field"></div>

      <div class="pixels">
        <!-- left band, above the logo -->
        <i style="left: 22px;   top: 16px;  width: 14px; height: 14px; opacity: 0.10; --ink-opacity: 0.07"></i>
        <i style="left: 66px;   top: 46px;  width: 10px; height: 10px; opacity: 0.08; --ink-opacity: 0.05"></i>
        <i style="left: 12px;   top: 74px;  width: 20px; height: 20px; opacity: 0.12; --ink-opacity: 0.08"></i>
        <i style="left: 98px;   top: 12px;  width: 12px; height: 12px; opacity: 0.07; --ink-opacity: 0.05"></i>
        <i style="left: 130px;  top: 58px;  width: 16px; height: 16px; opacity: 0.09; --ink-opacity: 0.06"></i>
        <i style="left: 44px;   top: 104px; width: 18px; height: 18px; opacity: 0.11; --ink-opacity: 0.07"></i>
        <!-- thin bands above and below the copy -->
        <i style="left: 300px;  top: 8px;   width: 12px; height: 12px; opacity: 0.07; --ink-opacity: 0.05"></i>
        <i style="left: 612px;  top: 12px;  width: 10px; height: 10px; opacity: 0.06; --ink-opacity: 0.04"></i>
        <i style="left: 470px;  top: 168px; width: 14px; height: 14px; opacity: 0.08; --ink-opacity: 0.05"></i>
        <i style="left: 742px;  top: 174px; width: 12px; height: 12px; opacity: 0.07; --ink-opacity: 0.05"></i>
        <!-- right band, clear of the mark -->
        <i style="left: 838px;  top: 28px;  width: 18px; height: 18px; opacity: 0.11; --ink-opacity: 0.07"></i>
        <i style="left: 884px;  top: 122px; width: 12px; height: 12px; opacity: 0.08; --ink-opacity: 0.05"></i>
        <i style="left: 1012px; top: 10px;  width: 14px; height: 14px; opacity: 0.09; --ink-opacity: 0.06"></i>
        <i style="left: 1066px; top: 44px;  width: 22px; height: 22px; opacity: 0.13; --ink-opacity: 0.08"></i>
        <i style="left: 1098px; top: 128px; width: 16px; height: 16px; opacity: 0.10; --ink-opacity: 0.06"></i>
        <i style="left: 958px;  top: 166px; width: 18px; height: 18px; opacity: 0.11; --ink-opacity: 0.07"></i>
        <i style="left: 820px;  top: 152px; width: 10px; height: 10px; opacity: 0.07; --ink-opacity: 0.05"></i>
      </div>

      <div class="copy">
        <h1>Get cited when buyers ask AI.</h1>
        <p>Daily articles engineered for ChatGPT, Claude, Perplexity and Google AI Overviews.</p>
      </div>

      <div class="mark">
        <svg viewBox="0 0 24 24" role="img" aria-label="Rankbox">
          <path
            d="M2.6 2.6 Q12 6.9 21.4 2.6 Q17.1 12 21.4 21.4 Q12 17.1 2.6 21.4 Q6.9 12 2.6 2.6 Z"
            fill="currentColor"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linejoin="round"
          />
        </svg>
      </div>

      <div class="guide"></div>
    </div>

    <script>
      /* ?v=blue|ink|open, ?guides=1 — read here so the three variants stay
         one stylesheet instead of three drifting copies. */
      const q = new URLSearchParams(location.search);
      const v = q.get("v") || "blue";
      if (v !== "blue") document.body.classList.add(v);
      if (q.get("guides")) document.body.classList.add("guides");
    </script>
  </body>
</html>
