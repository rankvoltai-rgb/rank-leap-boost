<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      /* Square, edge to edge: the window size passed to Chrome is the icon
         size, and the mark carries its own inset inside the 24x24 viewBox.
         Opaque white, because a tab strip or a home screen is free to put
         anything behind a transparent icon. */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
      }
      svg {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!-- The Rankbox mark in brand blue, matching public/mark.svg. -->
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path
        d="M2.6 2.6 Q12 6.9 21.4 2.6 Q17.1 12 21.4 21.4 Q12 17.1 2.6 21.4 Q6.9 12 2.6 2.6 Z"
        fill="#1877f2"
        stroke="#1877f2"
        stroke-width="1.6"
        stroke-linejoin="round"
      />
    </svg>
  </body>
</html>
