<!doctype html>
<!-- Variant 2 · Cluster 15 "The press release nobody read", one image.
     Isometric SEO-cards family (25): a near-white field with faint wave line
     art, white sheets laid on one tilted plane (25's matrix: horizontals at
     +10°, verticals at -19°). On the left, one press release lying flat, its
     syndicated copies drifting off and fading; on the right, the same sheet
     thirty times over, stacked into a block, the top one an article on your
     own site. Two price tags do the arguing: $850+ (published national wire
     list prices, 400-word release, 2025, with its source inside the dark
     tag) against the plan price from ads.js. No wire service is named or
     drawn. The stack's sheet count reads the offer's article count. Rankbox
     appears only in the close. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="formats" content="4x5" />
<link rel="stylesheet" href="../kit/kit.css" />
<link rel="stylesheet" href="ads2/ads2.css" />
<script src="../kit/kit.js"></script>
<script src="ads/ads.js"></script>
<script src="ads2/ads2.js"></script>
<style>
  html, body { background: #fff; }
  .canvas.v2 { background: #fbfcfe; color: #0c1018; }
  .y15-mesh { position: absolute; inset: 0; width: 1600px; height: 2000px; pointer-events: none; z-index: 0; }

  .y15-hl { position: absolute; left: 100px; right: 100px; top: 112px; z-index: 5; font-size: 118px; font-weight: 750; letter-spacing: -0.05em; line-height: 1; color: #0c1018; }
  .y15-hl span { color: var(--blue); }

  /* one sheet, laid on the tilted plane by script */
  .y15-sheet { position: absolute; left: 0; top: 0; width: 440px; height: 570px; transform-origin: 0 0; border-radius: 22px; background: #fff; padding: 34px 36px; z-index: 2;
    box-shadow: 0 0 0 1.5px rgba(20, 24, 40, 0.07); }
  .y15-sheet.edge { padding: 0; background: #f7f9fc; box-shadow: 0 0 0 1.5px #cdd6e4; }
  .y15-sheet.top { box-shadow: 0 0 0 1.5px #c6d5ee; }
  .y15-sheet.ghost { background: rgba(255, 255, 255, 0.6); box-shadow: 0 0 0 2px #d9dde4; }
  .y15-sheet .cap { font-size: 24px; font-weight: 800; letter-spacing: 0.12em; color: #121316; white-space: nowrap; }
  .y15-sheet .url { font-size: 24px; font-weight: 600; color: #8a909c; letter-spacing: -0.01em; white-space: nowrap; }
  .y15-sheet .ttl { margin-top: 14px; font-size: 32px; font-weight: 750; line-height: 1.16; letter-spacing: -0.03em; color: #0e0f12; }
  .y15-sheet i { display: block; height: 13px; margin-top: 17px; border-radius: 99px; background: #e5e8ed; }
  .y15-sheet i.h { height: 24px; margin-top: 24px; background: #b9c0cb; }
  .y15-sheet i.h + i.h { margin-top: 12px; }
  .y15-sheet i.q { height: 16px; background: #a9c8f8; }
  .y15-sheet i.s { width: 56%; }
  .y15-sheet i.m { width: 80%; }
  .y15-sheet .end { margin-top: 30px; text-align: center; font-size: 26px; font-weight: 700; letter-spacing: 0.3em; color: #9aa0ac; }
  .y15-sheet .chip { display: inline-flex; align-items: center; gap: 8px; margin-top: 22px; height: 40px; padding: 0 16px; border-radius: 999px; background: #e8f1ff; color: #1561d6; font-size: 24px; font-weight: 650; white-space: nowrap; }
  .y15-sheet .chip svg { width: 22px; height: 22px; }
  .y15-floor { position: absolute; z-index: 1; border-radius: 50%; background: rgba(12, 30, 70, 0.2); filter: blur(30px); }

  /* price tags pinned to each */
  .y15-tag { position: absolute; z-index: 60; padding: 30px 34px 32px; border-radius: 30px; color: #fff; }
  .y15-tag .k { font-size: 24px; font-weight: 750; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.72; white-space: nowrap; }
  .y15-tag b { display: block; margin-top: 10px; font-size: 104px; font-weight: 800; letter-spacing: -0.055em; line-height: 0.95; white-space: nowrap; }
  .y15-tag b small { font-size: 40px; font-weight: 700; letter-spacing: -0.03em; margin-left: 4px; }
  .y15-tag p { margin-top: 14px; font-size: 30px; font-weight: 600; line-height: 1.25; letter-spacing: -0.02em; }
  .y15-tag em { display: block; margin-top: 16px; font-style: normal; font-size: 24px; font-weight: 500; line-height: 1.3; color: #9aa3b2; }
  .y15-tag.a { left: 96px; top: 1238px; width: 560px; background: #0c1018; transform: rotate(-2.5deg); box-shadow: 0 34px 60px -24px rgba(4, 12, 40, 0.55); }
  .y15-tag.b { left: 930px; top: 1318px; width: 570px; background: var(--blue); transform: rotate(2.5deg); box-shadow: 0 34px 60px -24px rgba(16, 80, 200, 0.6); }
  .y15-tag.b .k { opacity: 0.85; }

  .y15-syn { position: absolute; z-index: 60; left: 64px; top: 905px; padding: 18px 26px; border-radius: 22px; background: rgba(255, 255, 255, 0.92); box-shadow: 0 0 0 1.5px #e3e6eb, 0 16px 30px -18px rgba(12, 30, 70, 0.3); font-size: 28px; font-weight: 600; line-height: 1.25; letter-spacing: -0.015em; color: #6b7280; transform: rotate(-3deg); }
  .y15-close { bottom: 96px; box-shadow: 0 0 0 2px #e4e8ef, 0 40px 80px -30px rgba(12, 30, 70, 0.28); }
  .y15-close p { flex: 1; font-size: 35px; font-weight: 650; line-height: 1.24; letter-spacing: -0.02em; color: #0c1018; }
  .y15-close p span { display: block; margin-top: 10px; font-size: 26px; font-weight: 500; color: #4a5160; white-space: nowrap; }
  .y15-close .v2-logo svg { color: var(--blue); width: 60px; height: 60px; }
</style>
</head>
<body>
<div class="canvas v2">
  <svg class="y15-mesh" id="y15-mesh" viewBox="0 0 1600 2000"></svg>

  <h1 class="y15-hl">One press release,<br /><span>or a month of answers?</span></h1>

  <div id="y15-scene"></div>

  <div class="y15-syn">Syndicated to pages<br />almost nobody reads</div>

  <div class="y15-tag a">
    <div class="k">One national wire release</div>
    <b>$850+</b>
    <em>Source: published national wire list prices, 400-word release, 2025</em>
  </div>
  <div class="y15-tag b">
    <div class="k">A month of answers</div>
    <b id="y15-price" data-offer="price"></b>
    <p><span data-offer="articles"></span> on your own site, built to be quoted.</p>
  </div>

  <div class="v2-close y15-close">
    <span class="v2-logo"><svg><use href="#lg-rankbox"/></svg></span>
    <p>Rankbox is an always-on PR engine<br />aimed at what AI reads.<span data-offer="line"></span></p>
    <div class="v2-go"><span data-offer="cta"></span><svg><use href="#ic-arrow-right"/></svg></div>
  </div>
</div>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    // B's price, set by ads.js: the amount large, the period small.
    const p = document.getElementById("y15-price");
    const [amt, per] = p.textContent.split("/");
    if (per) p.innerHTML = `${amt}<small>/${per}</small>`;

    // 25's plane: x' = .9843x - .3263y, y' = .1765x + .9453y. Sheets are
    // placed by plane coordinates; a stack rises straight up on screen.
    const M = [0.9843, 0.1765, -0.3263, 0.9453];
    const O = { x: 430, y: 590 };
    const at = (px, py) => ({ x: O.x + M[0] * px + M[2] * py, y: O.y + M[1] * px + M[3] * py });
    const W = 440, H = 570;
    const scene = document.getElementById("y15-scene");
    let html = "";
    const sheet = (px, py, lift, cls, body, extra = "") => {
      const s = at(px, py);
      html += `<div class="y15-sheet ${cls}" style="transform:translate(${s.x.toFixed(1)}px, ${(s.y - lift).toFixed(1)}px) matrix(${M.join(",")},0,0);${extra}">${body}</div>`;
    };
    const floor = (px, py, w, h, o) => {
      const c = at(px + W / 2, py + H / 2);
      html += `<div class="y15-floor" style="left:${c.x - w / 2}px;top:${c.y - h / 2 + 40}px;width:${w}px;height:${h}px;opacity:${o}"></div>`;
    };
    const release = `<div class="cap">FOR IMMEDIATE RELEASE</div><i class="h"></i><i class="h m"></i><i class="s"></i><i></i><i class="m"></i><i></i><i></i><i class="m"></i><i></i><i class="s"></i><i></i><i class="m"></i><div class="end">###</div>`;

    // A: one release lying flat, and its syndicated copies drifting off, fading.
    const A = { x: -40, y: 0 };
    const det = M[0] * M[3] - M[1] * M[2];
    const toPlane = (dx, dy) => [(M[3] * dx - M[2] * dy) / det, (-M[1] * dx + M[0] * dy) / det];
    [[-400, -170, 0.18], [-210, -88, 0.42]].forEach(([dx, dy, o]) => {
      const [px, py] = toPlane(dx, dy);
      sheet(A.x + px, A.y + py, 0, "ghost", release, `opacity:${o}`);
    });
    floor(A.x, A.y, 520, 120, 0.5);
    sheet(A.x, A.y, 0, "", release);

    // B: the same sheet once per article in the offer, stacked into a block.
    const B = { x: 540, y: -10 };
    const n = parseInt(window.OFFER.articles, 10) || 30;
    const dz = 7;
    floor(B.x, B.y, 600, 150, 0.85);
    for (let i = 0; i < n; i++) {
      const top = i === n - 1;
      sheet(B.x, B.y, i * dz, top ? "top" : "edge", top
        ? `<div class="url">yoursite.com/blog</div><div class="ttl">Which Project Tool Fits a 50-Person Team?</div><i class="q"></i><i class="q m"></i><i></i><i class="m"></i><i></i><i class="s"></i><span class="chip"><svg><use href="#ic-check"/></svg>Answers up front</span><i class="h s"></i><i></i><i class="m"></i>`
        : "", `z-index:${3 + i}`);
    }
    scene.innerHTML = html;

    // Faint wave line art (25): a twisted ribbon of fine lines behind the
    // sheets, and a looser sweep at the lower right.
    const mesh = document.getElementById("y15-mesh");
    mesh.innerHTML = `<defs>
      <linearGradient id="y15-f1" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.18" stop-color="#fff"/><stop offset="0.7" stop-color="#fff"/><stop offset="0.95" stop-color="#fff" stop-opacity="0"/></linearGradient>
      <mask id="y15-m1"><rect width="1600" height="2000" fill="url(#y15-f1)"/></mask>
      <radialGradient id="y15-f2" cx="0.88" cy="0.7" r="0.3"><stop offset="0.25" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
      <mask id="y15-m2"><rect width="1600" height="2000" fill="url(#y15-f2)"/></mask>
      <radialGradient id="y15-f3" cx="0.9" cy="0.2" r="0.24"><stop offset="0.2" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
      <mask id="y15-m3"><rect width="1600" height="2000" fill="url(#y15-f3)"/></mask></defs>`;
    const ns = "http://www.w3.org/2000/svg";
    const poly = (pts) => "M" + pts.map((q) => q[0].toFixed(1) + " " + q[1].toFixed(1)).join(" L");
    const lines = (paths, mask, op) => {
      const g = document.createElementNS(ns, "path");
      g.setAttribute("d", paths.join(" "));
      g.setAttribute("fill", "none");
      g.setAttribute("stroke", "#cfd3db");
      g.setAttribute("stroke-width", "1.2");
      g.setAttribute("opacity", op);
      g.setAttribute("mask", `url(#${mask})`);
      mesh.appendChild(g);
    };
    const ribbonY = (x, i) => {
      const u = (x - 0) / 1600;
      return 470 + 260 * u + 70 * Math.sin(Math.PI * (u * 1.4 - 0.2)) + i * (7 + 6 * u) + 16 * Math.sin(u * 9 + i * 0.16);
    };
    const N = 30, A1 = [], B1 = [];
    for (let i = 0; i < N; i++) { const pts = []; for (let x = 0; x <= 1600; x += 10) pts.push([x, ribbonY(x, i)]); A1.push(poly(pts)); }
    for (let j = 0; j < 52; j++) { const x0 = 300 + j * 20; const pts = []; for (let i = 0; i < N; i++) { const x = x0 - i * 3.2; pts.push([x, ribbonY(x, i)]); } B1.push(poly(pts)); }
    lines(A1, "y15-m1", 0.55);
    lines(B1, "y15-m1", 0.32);
    const C = [];
    for (let i = 0; i < 18; i++) {
      const pts = [];
      for (let x = 1000; x <= 1620; x += 10) { const u = (x - 1000) / 620; pts.push([x, 1560 + i * 14 - 300 * u + 80 * u * u + 20 * Math.sin(u * 5 + i * 0.25)]); }
      C.push(poly(pts));
    }
    lines(C, "y15-m2", 0.5);
    // and one more loose sweep in the empty top-right corner
    const D = [];
    for (let i = 0; i < 20; i++) {
      const pts = [];
      for (let x = 1060; x <= 1620; x += 10) { const u = (x - 1060) / 560; pts.push([x, 520 + i * 12 - 250 * u + 60 * u * u + 18 * Math.sin(u * 4.4 + i * 0.22)]); }
      D.push(poly(pts));
    }
    lines(D, "y15-m3", 0.5);
  });
</script>
</body>
</html>
