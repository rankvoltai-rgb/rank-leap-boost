<!doctype html>
<!-- Variant 2 · Cluster 47 "The 40-word search", one image.
     FramerForms family (18–21): flat brand blue, heavy caps headline, a big
     white panel in perspective with a pill lifted off it and a cursor on its
     button. The joke is size: the old two-word search sits as a tiny chip
     set into the headline, right after "TWO WORDS", and the modern prompt
     fills the frame. The prompt is the spec's, 24 words counted exactly
     ("4-person" and "$50" are one word each); the script checks the count
     against the text and writes it into the pill. The four highlighted
     phrases are the "whole situation" the primary text names (team size,
     tools, deal-breakers, budget). Generic chat, no engine UI or logo.
     Rankbox appears only in the close. No statistic, so no source line. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="formats" content="4x5" />
<link rel="stylesheet" href="../kit/kit.css" />
<link rel="stylesheet" href="ads2/ads2.css" />
<script src="../kit/kit.js"></script>
<script src="ads/ads.js"></script>
<script src="ads2/ads2.js"></script>
<style>
  .canvas.v2 { background: #1a6ff2; }
  .canvas.v2 .grain { --grain: 0.07; }

  .y47-hl { position: absolute; left: 92px; top: 118px; font-size: 156px; color: #fff; white-space: nowrap; }
  .y47-hl .l3 { display: inline-flex; align-items: center; }

  /* then: the old two-word search, tiny, set into the headline */
  .y47-then { position: relative; display: inline-flex; flex-direction: column; align-items: flex-start; gap: 14px; margin-left: 40px; transform: rotate(-5deg) translateY(-6px); -webkit-text-stroke: 0; text-transform: none; letter-spacing: 0; line-height: 1; }
  .y47-old { display: flex; height: 78px; border-radius: 12px; background: #fff; overflow: hidden;
    box-shadow: 0 22px 40px -18px rgba(3, 20, 80, 0.55), 0 0 0 2px rgba(255, 255, 255, 0.5); }
  .y47-old span { display: flex; align-items: center; padding: 0 26px 0 24px; font-size: 34px; font-weight: 500; color: #1d222c; letter-spacing: -0.015em; }
  .y47-old em { display: grid; place-items: center; width: 78px; background: #eef0f3; border-left: 2px solid #dfe2e7; color: #6b7280; }
  .y47-old em svg { width: 32px; height: 32px; }
  .y47-pill { display: inline-flex; align-items: center; height: 52px; padding: 0 22px; border-radius: 999px; font-size: 27px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
  .y47-pill.two { gap: 10px; background: #0c1018; color: #fff; box-shadow: 0 14px 24px -12px rgba(3, 20, 80, 0.6); }
  .y47-pill.two i { width: 12px; height: 12px; border-radius: 50%; background: #5aa9ff; }

  /* now: the prompt, the size of the frame */
  .y47-stage { position: absolute; left: 0; top: 0; width: 1600px; height: 2000px; perspective: 2600px; perspective-origin: 30% 40%; }
  .y47-card { position: absolute; left: 92px; top: 700px; width: 1336px; padding: 48px 60px 50px; border-radius: 44px; background: #fff; color: #0c1018;
    transform: rotateX(6deg) rotateY(-7deg) rotateZ(-1.6deg); transform-origin: 50% 0;
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.7), 0 70px 120px -40px rgba(3, 20, 80, 0.6), 0 26px 50px -26px rgba(3, 20, 80, 0.45); }
  .y47-head { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 650; color: #1561d6; letter-spacing: -0.015em; }
  .y47-head svg { width: 34px; height: 34px; color: var(--blue); }
  .y47-head .new { margin-left: auto; font-size: 27px; font-weight: 550; color: #9aa0ac; }
  .y47-q { margin-top: 30px; font-size: 86px; font-weight: 600; line-height: 1.22; letter-spacing: -0.035em; color: #0c1018; }
  .y47-q mark { background: linear-gradient(180deg, transparent 58%, #cfe2ff 58%, #cfe2ff 94%, transparent 94%); color: inherit; padding: 0 2px; margin: 0 -2px; }
  .y47-q mark.nb { white-space: nowrap; }
  .y47-caret { display: inline-block; width: 6px; height: 0.9em; margin-left: 6px; vertical-align: -0.1em; background: var(--blue); border-radius: 3px; }
  .y47-foot { margin-top: 44px; padding-top: 36px; border-top: 2.5px solid #eef0f3; display: flex; align-items: center; gap: 22px; }
  .y47-foot .ic { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; color: #6b7280; box-shadow: inset 0 0 0 2.5px #e3e6eb; }
  .y47-foot .ic svg { width: 38px; height: 38px; }
  .y47-send { margin-left: auto; width: 120px; height: 120px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; box-shadow: 0 16px 30px -12px rgba(22, 111, 229, 0.8); }
  .y47-send svg { width: 56px; height: 56px; }

  /* the count, lifted off the card */
  .y47-count { position: absolute; z-index: 5; left: 1060px; top: 630px; display: flex; align-items: center; gap: 16px; height: 112px; padding: 0 44px 0 36px; border-radius: 999px; background: #0c1018; color: #fff;
    font-size: 54px; font-weight: 750; letter-spacing: -0.035em; white-space: nowrap; transform: rotate(5deg);
    box-shadow: 0 30px 50px -20px rgba(3, 20, 80, 0.7); }
  .y47-count i { width: 22px; height: 22px; border-radius: 50%; background: #5aa9ff; }

  .y47-stage .cur { --cs: 110px; }

  .v2-close { bottom: 96px; }
  .v2-close p { flex: 1; font-size: 34px; font-weight: 650; line-height: 1.24; letter-spacing: -0.02em; color: #0c1018; }
  .v2-close p span { display: block; margin-top: 10px; font-size: 26px; font-weight: 500; color: #4a5160; white-space: nowrap; }
  .v2-close .v2-logo { color: var(--blue); }
  .v2-close .v2-logo svg { width: 58px; height: 58px; }
</style>
</head>
<body>
<div class="canvas v2">
  <div class="v2-px"></div>
  <div class="grain"></div>

  <h1 class="y47-hl hl-caps">Your buyers<br />stopped typing<br /><span class="l3">two words.<span class="y47-then"><span class="y47-old"><span>best crm</span><em><svg><use href="#ic-search"/></svg></em></span><span class="y47-pill two"><i></i>2 words</span></span></span></h1>

  <div class="y47-stage">
    <div class="y47-card" id="card">
      <div class="y47-head"><svg><use href="#ic-sparkle"/></svg>Ask AI</div>
      <p class="y47-q" id="q">Recommend a CRM for a <mark class="nb">4-person</mark> consulting firm that needs <mark>Stripe recurring billing</mark>, a clean pipeline view and <mark class="nb">no bloat</mark>, <mark>under $50 a month</mark>.<span class="y47-caret"></span></p>
      <div class="y47-foot">
        <span class="ic"><svg><use href="#ic-attach"/></svg></span>
        <span class="ic"><svg><use href="#ic-mic"/></svg></span>
        <span class="y47-send" id="send"><svg><use href="#ic-arrow-up"/></svg></span>
      </div>
    </div>
    <svg class="cur" id="cur"><use href="#ic-cursor"/></svg>
  </div>

  <div class="y47-count"><i></i><span id="count">24 words</span></div>

  <div class="v2-close">
    <span class="v2-logo"><svg><use href="#lg-rankbox"/></svg></span>
    <p>Rankbox finds the detailed questions your buyers ask and writes an answer for each.<span data-offer="line"></span></p>
    <div class="v2-go"><span data-offer="cta"></span><svg><use href="#ic-arrow-right"/></svg></div>
  </div>
</div>
<script>
  document.fonts.ready.then(() => {
    // The pill says what the prompt holds: count the words, never type it.
    const n = document.getElementById("q").textContent.trim().split(/\s+/).length;
    document.getElementById("count").textContent = n + " words";
    // Cursor tip on the send button, in screen space (the card is in 3D).
    const s = document.getElementById("send").getBoundingClientRect();
    const cur = document.getElementById("cur");
    cur.style.left = (s.left + s.width * 0.58) + "px";
    cur.style.top = (s.top + s.height * 0.6) + "px";
  });
</script>
</body>
</html>
