<!doctype html>
<!-- Cluster 12 · slide 1 of 2 · "What is the AI saying about you right now?"
     The viewer's world: an urgent alert an exec opens at once (a generic
     notification, no Slack or email branding) carrying an AI answer about
     their company that is confidently wrong. One accent: the blue alert
     badge. The false claims are marked in ink, never red or orange. The
     notifications stacked underneath carry no content. No Rankbox here. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="formats" content="4x5" />
<link rel="stylesheet" href="../kit/kit.css" />
<link rel="stylesheet" href="ads/ads.css" />
<script src="../kit/kit.js"></script>
<script src="ads/ads.js"></script>
<style>
  /* the alert, with two empty notifications stacked under it */
  .x12-stack { position: absolute; left: 110px; top: 700px; width: 1380px; }
  .x12-ghost { position: absolute; left: 50%; height: 200px; border-radius: 44px; background: #fff; transform: translateX(-50%); box-shadow: 0 0 0 2px #e6e8ec, 0 30px 60px -36px rgba(12, 30, 70, 0.22); }
  .x12-ghost.g1 { width: 94%; bottom: -56px; opacity: .9; }
  .x12-ghost.g2 { width: 87%; bottom: -112px; opacity: .65; }
  .x12-alert { position: relative; border-radius: 48px; padding: 70px 48px 58px; }

  .x12-head { display: flex; align-items: center; gap: 58px; padding-left: 26px; }
  .x12-badge { position: relative; width: 96px; height: 96px; flex: none; }
  .x12-badge b { position: absolute; inset: 0; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; font-size: 60px; font-weight: 800; line-height: 1; box-shadow: 0 14px 26px -12px rgba(22, 111, 229, 0.85); }
  .x12-badge i { position: absolute; border-radius: 50%; box-shadow: 0 0 0 3px rgba(24, 119, 242, 0.22); display: block; }
  .x12-badge i.r1 { inset: -18px; }
  .x12-badge i.r2 { inset: -38px; box-shadow: 0 0 0 3px rgba(24, 119, 242, 0.10); }
  .x12-from { flex: 1; }
  .x12-from b { display: block; font-size: 36px; font-weight: 750; letter-spacing: -0.02em; color: #0c1018; }
  .x12-from span { display: block; margin-top: 4px; font-size: 30px; font-weight: 500; color: #8a909c; letter-spacing: -0.01em; }
  .x12-now { align-self: flex-start; margin-top: 8px; font-size: 30px; font-weight: 600; color: #8a909c; }

  .x12-title { margin-top: 66px; font-size: 78px; font-weight: 750; letter-spacing: -0.04em; line-height: 1.04; color: #0c1018; }

  .x12-lab { margin-top: 64px; font-size: 28px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #8a909c; }
  .x12-ask { margin-top: 18px; display: inline-block; padding: 26px 36px; border-radius: 32px 32px 32px 8px; background: #eceef2; color: #12161f; font-size: 48px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.25; }

  .x12-ans { margin-top: 52px; padding: 44px 36px 52px; }
  .x12-ans p { margin-top: 22px; font-size: 60px; line-height: 1.55; font-weight: 500; letter-spacing: -0.025em; color: #3a4252; }
  .x12-claim { font-weight: 750; color: #0c1018; text-decoration: underline; text-decoration-thickness: 7px; text-underline-offset: 12px; text-decoration-color: #0c1018; text-decoration-skip-ink: none; }
  .x12-no { display: inline-flex; align-items: center; gap: 10px; height: 60px; padding: 0 22px 0 18px; margin: 0 6px 0 10px; border-radius: 16px; background: #0c1018; color: #fff; font-size: 30px; font-weight: 700; letter-spacing: -0.01em; vertical-align: 10px; white-space: nowrap; transform: rotate(-3deg); box-shadow: 0 10px 18px -10px rgba(12, 16, 24, 0.6); }
  .x12-no svg { width: 26px; height: 26px; }
</style>
</head>
<body>
<div class="canvas ad">
  <div class="ad-dots"></div>
  <div class="ad-top">
    <div class="ad-prog"><i class="on"></i><i></i></div>
    <div class="ad-step">Right now</div>
    <div class="ad-swipe">Swipe<svg><use href="#ic-arrow-right"/></svg></div>
  </div>
  <h1 class="ad-hl">Wait, that’s not true.<br /><span class="dim">How long has AI been saying that?</span></h1>

  <div class="x12-stack">
    <div class="x12-ghost g2"></div>
    <div class="x12-ghost g1"></div>
    <div class="ad-card flow x12-alert">
      <div class="x12-head">
        <div class="x12-badge"><i class="r2"></i><i class="r1"></i><b>!</b></div>
        <div class="x12-from"><b>Alert</b><span>Needs your attention</span></div>
        <div class="x12-now">now</div>
      </div>
      <div class="x12-title">An AI answer about your company</div>

      <div class="x12-lab">A buyer asked</div>
      <div class="x12-ask">Does your company offer a free trial?</div>

      <div class="ad-answer x12-ans">
        <div class="lab"><svg><use href="#ic-sparkle"/></svg>AI answer</div>
        <p>No. <span class="x12-claim">It doesn’t offer a free trial,</span><span class="x12-no"><svg><use href="#ic-x"/></svg>Not true</span> and<br /><span class="x12-claim">it only integrates with Salesforce.</span><span class="x12-no"><svg><use href="#ic-x"/></svg>Not true</span></p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
