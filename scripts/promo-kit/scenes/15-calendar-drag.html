<!doctype html>
<!-- 15 · Drag to reschedule. After Scroll Sequence's drop-zone shot: an
     out-of-focus photo on the left, the dark editor canvas on the right with
     the October frame's blue outline, the Calendar panel in front, and a sheet
     of Brightloop articles dragged across its drop zone, fading as it goes.
     Calendar drag-and-drop is real (FACTS: "Articles drag between days"). -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="formats" content="4x3" />
<link rel="stylesheet" href="../kit/kit.css" />
<script src="../kit/kit.js"></script>
<style>
  html, body { background: #1b1c1e; }
  .canvas { background: #1b1c1e; }

  /* ---------------------------------------------------------- the photo */
  .cd-photo { position: absolute; inset: 0; z-index: -3; width: 1600px; height: 1200px; display: block; }
  /* The editor canvas swallowing the photo's right side. */
  .cd-fade {
    position: absolute; inset: 0; z-index: -2; pointer-events: none;
    background:
      linear-gradient(102deg, rgba(27, 28, 30, 0) 0%, rgba(27, 28, 30, 0) 38%, rgba(27, 28, 30, 0.55) 52%, rgba(27, 28, 30, 0.92) 64%, #1b1c1e 72%);
  }
  .cd-vig {
    position: absolute; inset: 0; z-index: -2; pointer-events: none;
    background:
      radial-gradient(130% 100% at 20% 30%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.18) 100%);
  }
  .grain { --grain: 0.2; }

  /* ---------------------------------------------------------- the frame */
  .cd-band { position: absolute; left: 640px; right: 0; top: 286px; height: 99px; background: rgba(42, 120, 196, 0.045); }
  .cd-label { position: absolute; left: 976px; top: 314px; font-size: 31px; font-weight: 500; letter-spacing: -0.01em; color: #2a8fd8; white-space: nowrap; }
  .cd-label b { font-weight: 500; margin-left: 0.32em; }
  .cd-hline { position: absolute; left: 771px; right: 0; top: 408px; height: 2px; background: #2990d4; }
  .cd-vline { position: absolute; left: 770px; top: 408px; bottom: 0; width: 2px; background: #2990d4; opacity: 0.55; }

  /* ---------------------------------------------------------- the panel */
  .cd-panel {
    position: absolute; left: 90px; top: 210px; width: 857px; height: 861px;
    border-radius: 40px;
    background: #141516;
    box-shadow:
      inset 0 0 0 1.5px rgba(255, 255, 255, 0.13),
      0 34px 70px -34px rgba(0, 0, 0, 0.55),
      0 12px 26px -16px rgba(0, 0, 0, 0.4);
    color: #f4f4f5;
  }
  .cd-head { position: absolute; left: 34px; right: 34px; top: 35px; height: 50px; display: flex; align-items: center; }
  .cd-head .app { --s: 48px; --r: 12px; }
  .cd-head .cd-title { margin-left: 26px; display: flex; align-items: center; gap: 12px; font-size: 28.5px; font-weight: 600; letter-spacing: -0.02em; }
  .cd-head .cd-title svg { width: 21px; height: 21px; color: #a3a4a9; margin-top: 3px; }
  .cd-head .cd-x { margin-left: auto; width: 23px; height: 23px; color: #c4c5c9; margin-right: 1px; }

  .cd-panel .seg.dark {
    position: absolute; left: 27px; top: 146px; width: 803px; height: 92px;
    display: flex; padding: 8px; gap: 0;
    border-radius: 999px; background: #1f2022;
  }
  .cd-panel .seg.dark > span {
    flex: 1; height: 76px; padding: 0; border-radius: 999px;
    font-size: 28px; font-weight: 500; letter-spacing: -0.01em; color: #c3c4c8;
  }
  .cd-panel .seg.dark > span.on { flex: 0 0 393px; background: #343538; color: #f4f4f5; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.35); }

  .cd-drop { position: absolute; left: 27px; top: 257px; width: 803px; height: 467px; border-radius: 28px; background: #1d1e20; }
  .cd-drop > svg.cd-dash { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .cd-drop .cd-hint {
    position: absolute; left: 0; right: 76px; top: 214px;
    display: flex; align-items: center; justify-content: center; gap: 18px;
    font-size: 30px; font-weight: 500; letter-spacing: -0.012em; color: #b2b3b8;
  }
  .cd-drop .cd-hint svg { width: 40px; height: 40px; color: #b2b3b8; }

  .cd-btn {
    position: absolute; left: 27px; top: 752px; width: 803px; height: 84px; border-radius: 999px;
    background: #19191b;
    display: flex; align-items: center; justify-content: center; gap: 16px;
    font-size: 30px; font-weight: 500; letter-spacing: -0.012em; color: #404145;
  }
  .cd-btn svg { width: 36px; height: 36px; color: #3d3e42; }

  /* ---------------------------------------------------------- the sheet */
  /* One layer the size of the canvas, so the fade is drawn in canvas px:
     the sheet dissolves to the right and toward the bottom, as in the ref. */
  .cd-sheet {
    position: absolute; inset: 0; z-index: 4; pointer-events: none;
    -webkit-mask-image:
      linear-gradient(90deg, #000 0, #000 952px, rgba(0, 0, 0, 0.8) 1010px, rgba(0, 0, 0, 0.58) 1075px, rgba(0, 0, 0, 0.31) 1150px, rgba(0, 0, 0, 0.17) 1210px, transparent 1292px),
      linear-gradient(180deg, #000 0, #000 860px, rgba(0, 0, 0, 0.62) 893px, rgba(0, 0, 0, 0.36) 940px, rgba(0, 0, 0, 0.24) 985px, rgba(0, 0, 0, 0.1) 1016px, transparent 1048px);
    -webkit-mask-composite: source-in;
            mask-image:
      linear-gradient(90deg, #000 0, #000 952px, rgba(0, 0, 0, 0.8) 1010px, rgba(0, 0, 0, 0.58) 1075px, rgba(0, 0, 0, 0.31) 1150px, rgba(0, 0, 0, 0.17) 1210px, transparent 1292px),
      linear-gradient(180deg, #000 0, #000 860px, rgba(0, 0, 0, 0.62) 893px, rgba(0, 0, 0, 0.36) 940px, rgba(0, 0, 0, 0.24) 985px, rgba(0, 0, 0, 0.1) 1016px, transparent 1048px);
            mask-composite: intersect;
  }
  .cd-card { position: absolute; width: 168px; height: 98px; }
  .cd-thumb {
    position: absolute; inset: 0; padding: 4px; border-radius: 9px; background: #fff;
    box-shadow: 0 10px 22px -12px rgba(0, 0, 0, 0.6);
  }
  .cd-cover { position: relative; width: 100%; height: 100%; border-radius: 6px; overflow: hidden; }
  .cd-cover::before {
    content: ""; position: absolute; right: -26px; top: -30px; width: 96px; height: 96px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255, 236, 200, 0.55), rgba(255, 236, 200, 0));
  }
  .cd-cover > i { position: absolute; left: 10px; top: 9px; width: 13px; height: 13px; border-radius: 50%; border: 3px solid #fff; opacity: 0.95; }
  .cd-cover > b {
    position: absolute; left: 10px; right: 8px; bottom: 8px;
    font-size: 16px; line-height: 1.08; font-weight: 700; letter-spacing: -0.02em; color: #fff;
    text-shadow: 0 1px 2px rgba(150, 50, 0, 0.25);
  }
  .cd-cover > em { position: absolute; left: 10px; bottom: 10px; display: grid; gap: 6px; }
  .cd-cover > em::before, .cd-cover > em::after { content: ""; display: block; height: 9px; border-radius: 5px; background: rgba(255, 255, 255, 0.9); }
  .cd-cover > em::before { width: 96px; }
  .cd-cover > em::after { width: 64px; }
  .cd-slug {
    position: absolute; left: 50%; top: 111px; transform: translateX(-50%);
    height: 26px; padding: 0 10px; border-radius: 999px;
    display: grid; place-items: center;
    background: #3c3d40; color: #ececee;
    font-size: 15px; font-weight: 500; letter-spacing: -0.005em; white-space: nowrap;
  }

  /* ---------------------------------------------------------- the cursor */
  .cd-arrow { position: absolute; z-index: 10; left: 1110px; top: 960px; width: 110px; height: 140px; overflow: visible; filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.35)); }
</style>
</head>
<body>
<div class="canvas">
  <!-- An out-of-focus photo: big soft forms in steel blue, navy and slate,
       blurred, with a faint velvet tooth from fractal noise. -->
  <svg class="cd-photo" viewBox="0 0 1600 1200" preserveAspectRatio="none">
    <defs>
      <filter id="cd-soft" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
        <feGaussianBlur stdDeviation="7" />
      </filter>
      <filter id="cd-softer" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
        <feGaussianBlur stdDeviation="30" />
      </filter>
      <!-- velvet: fine vertical streaks, smooth along their length -->
      <filter id="cd-velvet" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.035 0.0035" numOctaves="3" seed="4" />
        <feColorMatrix values="0 0 0 0 0.55  0 0 0 0 0.72  0 0 0 0 0.92  0 0 0 1.5 -0.62" />
        <feGaussianBlur stdDeviation="1.6" />
      </filter>
      <linearGradient id="cd-face" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#3d6a90" />
        <stop offset="0.07" stop-color="#2d5a7e" />
        <stop offset="0.155" stop-color="#1b4362" />
        <stop offset="0.27" stop-color="#183850" />
        <stop offset="0.4" stop-color="#1c3142" />
        <stop offset="0.55" stop-color="#1b2934" />
        <stop offset="0.75" stop-color="#1c242c" />
        <stop offset="1" stop-color="#1d2024" />
      </linearGradient>
      <linearGradient id="cd-seat" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#1a3648" />
        <stop offset="0.25" stop-color="#1b2c3a" />
        <stop offset="0.5" stop-color="#1b252f" />
        <stop offset="1" stop-color="#1c2023" />
      </linearGradient>
    </defs>
    <rect width="1600" height="1200" fill="#0e151f" />
    <g filter="url(#cd-softer)">
      <!-- the room behind the arm, top left -->
      <rect x="-120" y="-120" width="168" height="430" fill="#13456b" />
      <!-- the seat along the bottom, and the shade above it -->
      <path d="M-140 820 C 120 860 380 930 620 1000 L 980 1100 L 980 1340 L -140 1340 Z" fill="#182b3a" />
      <path d="M-140 1050 C 200 1050 520 1060 860 1100 L 900 1340 L -140 1340 Z" fill="url(#cd-seat)" />
    </g>
    <g filter="url(#cd-soft)">
      <!-- the cushion: a rounded corner top left, lit from the left -->
      <path d="M28 46 C 28 8 44 -16 86 -16 L 1240 -16 L 1240 300 L 70 302 C 44 302 30 288 30 262 Z" fill="url(#cd-face)" />
      <!-- the sheen down its left face -->
      <path d="M46 28 C 42 110 44 200 52 292" stroke="#6b8eb1" stroke-width="20" fill="none" stroke-linecap="round" opacity="0.85" />
      <path d="M78 40 C 74 120 76 210 82 290" stroke="#4a7398" stroke-width="26" fill="none" stroke-linecap="round" opacity="0.5" />
      <!-- the tuck at the corner -->
      <ellipse cx="46" cy="22" rx="7" ry="11" fill="#072b4d" />
      <!-- a soft crease across the face -->
      <path d="M260 -10 C 300 80 330 170 300 300" stroke="#16324a" stroke-width="46" fill="none" opacity="0.45" />
      <!-- the floor of shadow under the cushion -->
      <path d="M-40 300 L 300 300 L 300 820 C 160 800 40 790 -40 790 Z" fill="#0c121b" />
      <!-- the arm's lit edge where it turns under, far left -->
      <path d="M-30 268 C 0 276 12 286 14 306" stroke="#37607f" stroke-width="18" fill="none" opacity="0.8" />
      <!-- the seat's front edge catching light -->
      <path d="M-40 1084 C 220 1070 520 1078 820 1116" stroke="#24465f" stroke-width="20" fill="none" stroke-linecap="round" opacity="0.55" />
      <!-- a second seam lower down, as on the reference's seat -->
      <path d="M-40 1156 C 200 1140 460 1144 700 1170" stroke="#10202e" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.6" />
    </g>
    <rect width="1600" height="330" filter="url(#cd-velvet)" opacity="0.3" style="mix-blend-mode: soft-light" />
  </svg>
  <div class="cd-fade"></div>
  <div class="cd-vig"></div>
  <div class="grain"></div>

  <!-- the October frame on the canvas, selected -->
  <div class="cd-band"></div>
  <div class="cd-label">October<b>2026</b></div>
  <div class="cd-hline"></div>
  <div class="cd-vline"></div>

  <div class="cd-panel">
    <div class="cd-head">
      <div class="app rankbox"><svg><use href="#lg-rankbox"/></svg></div>
      <div class="cd-title">Calendar<svg><use href="#ic-chev-down"/></svg></div>
      <svg class="cd-x"><use href="#ic-x"/></svg>
    </div>
    <div class="seg dark"><span class="on">Month</span><span>Agenda</span></div>
    <div class="cd-drop">
      <svg class="cd-dash" viewBox="0 0 803 467" preserveAspectRatio="none"><rect x="1.5" y="1.5" width="800" height="464" rx="27" fill="none" stroke="#414246" stroke-width="3" stroke-dasharray="7 4" /></svg>
      <div class="cd-hint"><svg><use href="#ic-calendar"/></svg>Drop on a day to move it</div>
    </div>
    <div class="cd-btn"><svg><use href="#rb-calendar"/></svg>Schedule</div>
  </div>

  <div class="cd-sheet" id="sheet"></div>

  <svg class="cd-arrow" viewBox="0 0 110 140">
    <path d="M22 26 L22 97 L38.5 80.5 L53.5 118 L65.5 113 L52.5 78.5 L73.5 77 Z" fill="#000" stroke="#fff" stroke-width="12" stroke-linejoin="miter" stroke-miterlimit="6" paint-order="stroke" />
  </svg>
</div>
<script>
  // Eight Brightloop articles on the move, row by row, then one more
  // already dissolving into the canvas.
  const cards = [
    ["usage-based-pricing", "Usage-Based<br>Pricing, Explained"],
    ["saas-pricing", "How to Price a<br>SaaS Product"],
    ["freemium-vs-trial", "Freemium or<br>Free Trial?"],
    ["value-metric", "What Is a<br>Value Metric?"],
    ["pricing-page-test", "How to A/B Test<br>a Pricing Page"],
    ["churn-vs-retention", "Churn vs<br>Retention"],
    ["product-led-growth", "Product-Led<br>Growth"],
    ["onboarding-emails", "Writing<br>Onboarding Emails"],
    [null, null],
  ];
  const xs = [702, 919, 1136], ys = [519, 702, 886];
  const sheet = document.getElementById("sheet");
  cards.forEach(([slug, title], i) => {
    const x = xs[i % 3], y = ys[Math.floor(i / 3)];
    const cover = title ? `<i></i><b>${title}</b>` : `<i></i><em></em>`;
    const chip = slug ? `<span class="cd-slug">${slug}</span>` : "";
    sheet.insertAdjacentHTML("beforeend",
      `<div class="cd-card" style="left:${x}px;top:${y}px"><div class="cd-thumb"><div class="cd-cover bl-cover">${cover}</div></div>${chip}</div>`);
  });
</script>
</body>
</html>
