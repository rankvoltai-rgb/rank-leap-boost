<!doctype html>
<!-- 18 · Power up your Framer blog. After FramerForms' "POWER UP FRAMER FORMS":
     a flat brand-blue field, the Rankbox for Framer panel in strong
     perspective on the left (cropped by the bottom), its Content field lifted
     out onto the field as a card with the cursor dragging it, the wordmark
     top right and the headline bottom right.
     The panel and the card are mapped with matrix3d homographies fitted to the
     reference's measured corners, so the perspective matches it. The panel's
     fields are the plugin's real collection fields (FACTS: Title, Slug,
     Content, Description, Tags, SEO Score). The plugin isn't approved yet. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="formats" content="4x3" />
<link rel="stylesheet" href="../kit/kit.css" />
<script src="../kit/kit.js"></script>
<style>
  .canvas { background: #1a6ff2; }
  .grain { --grain: 0.06; }

  /* ------------------------------------------------ wordmark + headline */
  .pw-mark { position: absolute; left: 903px; top: 99px; }
  .pw-mark .wm { font-size: 54px; color: #fff; }
  .pw-kern { letter-spacing: -0.005em; }
  .pw-hl { position: absolute; left: 898px; top: 848px; font-size: 90px; line-height: 0.99; color: #fff; white-space: nowrap; }

  /* ------------------------------------------------ the plugin panel
     Laid out flat at 760px wide, then projected. */
  .pw-panel {
    position: absolute; left: 0; top: 0;
    width: 760px; height: 1180px;
    border-radius: 42px;
    transform-origin: 0 0;
    transform: matrix3d(0.96069812, 0.087759911, 0, 6.3324139e-05, -0.03152688, 0.86310796, 0, -0.00011, 0, 0, 1, 0, 78, 87.1, 0, 1);
    box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.4), 0 50px 90px -40px rgba(3, 22, 80, 0.45);
  }
  .pw-panel > * { position: absolute; }
  .pw-head { left: 39px; right: 36px; top: 40px; height: 48px; display: flex; align-items: center; gap: 0; font-size: 29px; font-weight: 600; letter-spacing: -0.02em; color: #262a31; }
  .pw-head .app { --s: 48px; --r: 12px; margin-right: 27px; }
  .pw-head .pw-x { margin-left: auto; width: 28px; height: 28px; color: #8a8f99; }
  .pw-rule { left: 38px; right: 40px; top: 124px; height: 2px; background: #ececef; }
  .pw-back { left: 36px; top: 165px; height: 34px; line-height: 34px; display: flex; align-items: center; gap: 15px; font-size: 28px; font-weight: 500; color: #a2a6ae; letter-spacing: -0.01em; }
  .pw-back svg { width: 28px; height: 28px; }
  .pw-title { left: 39px; top: 231px; font-size: 47px; font-weight: 800; letter-spacing: -0.035em; line-height: 1; color: #23262d; white-space: nowrap; }
  .pw-desc { left: 40px; top: 308px; width: 640px; font-size: 30px; line-height: 46px; font-weight: 500; letter-spacing: -0.012em; color: #7c818b; }

  .pw-tile { border-radius: 30px; background: #f3f3f4; }
  .pw-tile > * { position: absolute; }
  .pw-tile .lbl { left: 0; right: 0; text-align: center; font-size: 29px; font-weight: 650; letter-spacing: -0.02em; color: #33363d; }
  .pw-wide { left: 37px; top: 444px; width: 688px; height: 312px; }
  .pw-wide .lbl { top: 246px; }
  .pw-half { top: 780px; width: 331px; height: 520px; }
  .pw-half .lbl { top: 244px; }
  .pw-l { left: 37px; }
  .pw-r { left: 394px; }

  /* the dashed field box with the article glyph */
  .pw-drop { display: grid; place-items: center; background: linear-gradient(180deg, #d8e6fd 0%, #e6edf7 100%); }
  .pw-drop > svg.g { width: var(--gs, 62px); height: var(--gs, 62px); color: var(--blue); }
  .pw-drop > svg.d { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .pw-wide .pw-drop { left: 267px; top: 65px; width: 154px; height: 111px; }

  /* Title: an empty input with the caret */
  .pw-input { left: 76px; top: 90px; width: 178px; height: 64px; border-radius: 16px; background: linear-gradient(180deg, #dbe8fd, #edf2f9); box-shadow: inset 0 0 0 2px #8fb9f8; }
  .pw-input i { position: absolute; left: 20px; top: 15px; width: 4px; height: 34px; border-radius: 2px; background: var(--blue); }

  /* Tags: two tag chips */
  .pw-tags { left: 0; right: 0; top: 102px; display: flex; justify-content: center; gap: 12px; }
  .pw-tags span { height: 44px; padding: 0 18px; border-radius: 999px; display: grid; place-items: center; background: #dce8fd; box-shadow: inset 0 0 0 1.5px #b9d3fb; color: #1561d6; font-size: 22px; font-weight: 650; letter-spacing: -0.01em; }

  /* ------------------------------------------------ the lifted card */
  .pw-pop {
    position: absolute; left: 0; top: 0;
    width: 340px; height: 305px;
    border-radius: 32px;
    background: linear-gradient(160deg, #ffffff 0%, #ffffff 55%, #eef1f5 100%);
    transform-origin: 0 0;
    transform: matrix3d(0.89039476, -0.064907291, 0, -5.3415819e-05, -0.33457821, 0.79837054, 0, -0.00024616644, 0, 0, 1, 0, 701.616, 348.412, 0, 1);
    box-shadow: 0 0 0 1.5px rgba(12, 16, 24, 0.04), 0 60px 100px -20px rgba(3, 18, 90, 0.34), 0 10px 22px -12px rgba(3, 20, 80, 0.16);
    z-index: 4;
  }
  .pw-pop .pw-drop { position: absolute; left: 62px; top: 62px; width: 210px; height: 164px; --gs: 86px; }

  .cur { --cs: 104px; left: 839px; top: 586px; }
</style>
</head>
<body>
<div class="canvas">
  <div class="grain"></div>

  <div class="pw-mark"><span class="wm caps"><svg><use href="#lg-rankbox"/></svg>Rankbox</span></div>

  <div class="lp pw-panel">
    <div class="pw-head">
      <div class="app rankbox"><svg><use href="#lg-rankbox"/></svg></div>
      Rankbox
      <svg class="pw-x"><use href="#ic-x"/></svg>
    </div>
    <div class="pw-rule"></div>
    <div class="pw-back"><svg><use href="#ic-chev-left"/></svg>Back</div>
    <div class="pw-title">Article fields</div>
    <p class="pw-desc">Every article lands as a real CMS item<br />with six fields.</p>

    <div class="pw-tile pw-wide">
      <div class="pw-drop">
        <svg class="d" viewBox="0 0 154 111"><rect x="1" y="1" width="152" height="109" fill="none" stroke="#1877f2" stroke-width="1.8" stroke-dasharray="5 4"/><circle cx="1" cy="1" r="5" fill="#1877f2"/><circle cx="153" cy="1" r="5" fill="#1877f2"/><circle cx="1" cy="110" r="5" fill="#1877f2"/><circle cx="153" cy="110" r="5" fill="#1877f2"/></svg>
        <svg class="g"><use href="#rb-article"/></svg>
      </div>
      <div class="lbl">Content</div>
    </div>

    <div class="pw-tile pw-half pw-l">
      <div class="pw-input"><i></i></div>
      <div class="lbl">Title</div>
    </div>
    <div class="pw-tile pw-half pw-r">
      <div class="pw-tags"><span>Pricing</span><span>SaaS</span></div>
      <div class="lbl">Tags</div>
    </div>
  </div>

  <div class="pw-pop">
    <div class="pw-drop">
      <svg class="d" viewBox="0 0 210 164"><rect x="1" y="1" width="208" height="162" fill="none" stroke="#1877f2" stroke-width="2" stroke-dasharray="6 5"/><circle cx="1" cy="1" r="6" fill="#1877f2"/><circle cx="209" cy="1" r="6" fill="#1877f2"/><circle cx="1" cy="163" r="6" fill="#1877f2"/><circle cx="209" cy="163" r="6" fill="#1877f2"/></svg>
      <svg class="g"><use href="#rb-article"/></svg>
    </div>
  </div>
  <svg class="cur"><use href="#ic-cursor"/></svg>

  <h1 class="hl-caps pw-hl">Power up<br />your F<span class="pw-kern">r</span>amer<br />blog</h1>
</div>
</body>
</html>
