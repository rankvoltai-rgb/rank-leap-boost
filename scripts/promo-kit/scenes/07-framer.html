<!doctype html>
<!-- 07 · Rankbox for Framer. The plugin panel between Framer and the AI answers
     it feeds. Rows are the plugin's real jobs: CMS sync, JSON-LD, live URLs,
     settings. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="formats" content="4x3 4x5" />
<link rel="stylesheet" href="../kit/kit.css" />
<script src="../kit/kit.js"></script>
<style>
  .canvas { background: linear-gradient(180deg, #f0f0f0 0%, #eef0f2 40%, #cfe8ff 74%, #a9d6ff 100%); }

  .brand { position: absolute; left: 0; right: 0; top: 66px; display: flex; justify-content: center; align-items: center; gap: 24px; color: var(--ink); }
  .brand svg { width: 76px; height: 76px; color: var(--blue); }
  .brand b { font-size: 92px; font-weight: 800; letter-spacing: -0.035em; text-transform: uppercase; line-height: 1; }

  .lpanel {
    position: absolute; left: 376px; top: 196px;
    width: 830px; height: 1100px;
    border-radius: 48px;
    background: #fff;
    box-shadow: 0 0 0 1.5px rgba(12,16,24,.04), 0 40px 80px -30px rgba(10,40,80,.28), 0 10px 30px -14px rgba(10,40,80,.16);
    overflow: hidden;
  }
  .lpanel .hd { display: flex; align-items: center; gap: 20px; height: 128px; padding: 0 42px; font-size: 40px; font-weight: 500; letter-spacing: -0.03em; color: #2a2e36; }
  .lpanel .hd svg.mk { width: 50px; height: 50px; color: var(--blue); }
  .lpanel .hd .close { width: 34px; height: 34px; color: #6b707a; }
  .lpanel .wrap { display: flex; }
  .lpanel .side { width: 92px; flex: none; display: grid; gap: 46px; justify-items: center; align-content: start; padding-top: 44px; border-right: 2px solid #eef0f2; height: 1000px; }
  .lpanel .side svg { width: 34px; height: 34px; color: #a4a9b2; }
  .lpanel .side svg.on { color: #2a2e36; }
  .lpanel .main { flex: 1; padding: 34px 0 0 42px; }
  .lpanel h2 { font-size: 56px; font-weight: 800; letter-spacing: -0.03em; text-transform: uppercase; color: var(--ink); line-height: 1; }
  .lpanel .sub { margin-top: 22px; width: 600px; font-size: 31px; line-height: 1.3; font-weight: 500; letter-spacing: -0.02em; color: #2a2e36; }
  .lpanel .search { display: flex; align-items: center; gap: 18px; margin-top: 30px; width: 656px; height: 80px; padding: 0 26px; border-radius: 22px; background: #f5f6f7; font-size: 30px; font-weight: 500; color: #a0a5ae; letter-spacing: -0.02em; box-shadow: inset 0 0 0 1.5px #eceef0; }
  .lpanel .search svg { width: 34px; height: 34px; color: #7a808a; }
  .lpanel .rows { margin-top: 30px; display: grid; gap: 18px; }
  .lpanel .row { position: relative; display: flex; align-items: center; width: 656px; height: 134px; padding: 0 0 0 36px; border-radius: 24px; background: #f5f6f7; box-shadow: inset 0 0 0 1.5px #eceef0; }
  .lpanel .row b { font-size: 36px; font-weight: 800; letter-spacing: -0.02em; text-transform: uppercase; color: var(--ink); }
  .lpanel .row .go { position: absolute; left: 330px; width: 40px; height: 40px; color: #6b707a; }
  .lpanel .thumb { position: absolute; right: -6px; top: 14px; width: 230px; height: 106px; }

  /* thumbnails */
  .t-doc { right: 40px; width: 104px; height: 106px; border-radius: 14px; background: #fff; box-shadow: 0 6px 16px -6px rgba(10,40,80,.25); padding: 14px; }
  .t-doc i { display: block; height: 7px; border-radius: 4px; background: #d6dae0; margin-top: 8px; }
  .t-doc i:first-child { margin-top: 0; height: 10px; background: #2a2e36; width: 80%; }
  .t-doc em { position: absolute; right: -16px; bottom: -8px; font-style: normal; height: 34px; padding: 0 10px; border-radius: 10px; background: #1fb15a; color: #fff; font-size: 18px; font-weight: 700; display: grid; place-items: center; }
  .t-code { right: -10px; width: 196px; height: 106px; border-radius: 14px; background: #10131a; padding: 14px 16px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 15px; line-height: 1.45; color: #9aa4b5; white-space: pre; box-shadow: 0 6px 16px -6px rgba(10,40,80,.35); }
  .t-code .k { color: #6fb2ff; } .t-code .s { color: #7ee0a1; }
  .t-url { top: 34px; right: -14px; width: 226px; height: 66px; border-radius: 999px; background: #fff; display: flex; align-items: center; gap: 10px; padding: 0 16px; font-size: 17px; font-weight: 600; color: #2a2e36; box-shadow: 0 6px 16px -6px rgba(10,40,80,.25); }
  .t-url .dot { width: 14px; height: 14px; background: #1fb15a; }

  .logo-l { position: absolute; left: 92px; top: 512px; width: 236px; height: 236px; color: #0c1018; }
  .logo-r { position: absolute; left: 1272px; top: 500px; width: 250px; height: 250px; color: #10a37f; }
  .dash { position: absolute; left: 0; top: 0; width: 1600px; height: var(--h); overflow: visible; pointer-events: none; }
  .cursor { position: absolute; left: 1124px; top: 846px; width: 110px; height: 110px; filter: drop-shadow(0 10px 14px rgba(0,0,0,.25)); }
  .lpanel .foot { position: absolute; left: 0; right: 0; bottom: 0; padding: 30px 42px 42px; border-top: 2px solid #eef0f2; background: #fff; }
  .lpanel .foot span { display: block; font-size: 28px; font-weight: 500; color: #6b707a; letter-spacing: -0.015em; }
  .lpanel .foot .sync { margin-top: 20px; height: 100px; border-radius: 22px; background: var(--blue); color: #fff; display: grid; place-items: center; font-size: 34px; font-weight: 650; letter-spacing: -0.02em; }

  /* 4:5 */
  html[data-f="4x5"] .brand { top: 120px; }
  html[data-f="4x5"] .lpanel { top: 300px; height: 1600px; }
  html[data-f="4x5"] .logo-l { top: 780px; }
  html[data-f="4x5"] .logo-r { top: 768px; }
  html[data-f="4x5"] .cursor { top: 950px; }
</style>
</head>
<body>
<div class="canvas">
  <div class="brand"><svg><use href="#lg-rankbox"/></svg><b>Rankbox</b></div>

  <svg class="logo-l"><use href="#lg-framer"/></svg>
  <svg class="logo-r"><use href="#lg-chatgpt"/></svg>
  <svg class="dash" id="dash">
    <path id="dl" stroke="#6f8496" stroke-width="16" stroke-linecap="round" stroke-dasharray="26 30" fill="none" />
    <path id="dr" stroke="#6f8496" stroke-width="16" stroke-linecap="round" stroke-dasharray="26 30" fill="none" />
  </svg>

  <div class="lpanel">
    <div class="hd"><svg class="mk"><use href="#lg-rankbox"/></svg>Rankbox<span class="close"><svg><use href="#ic-x"/></svg></span></div>
    <div class="wrap">
      <div class="side">
        <svg class="on"><use href="#ic-home"/></svg>
        <svg><use href="#ic-doc"/></svg>
        <svg><use href="#ic-chart"/></svg>
        <svg><use href="#ic-gear"/></svg>
      </div>
      <div class="main">
        <h2>Your blog</h2>
        <p class="sub">Rank on Google and in AI answers with articles synced to your CMS.</p>
        <div class="search"><svg><use href="#ic-search"/></svg>Search articles…</div>
        <div class="rows">
          <div class="row"><b>Articles</b><svg class="go"><use href="#ic-arrow-right"/></svg><div class="thumb t-doc"><i></i><i></i><i></i><i style="width:70%"></i><i></i><em>94</em></div></div>
          <div class="row"><b>Schema</b><svg class="go"><use href="#ic-arrow-right"/></svg><div class="thumb t-code"><span class="k">"@type"</span>: <span class="s">"Blog</span>
<span class="s">Posting"</span>,
<span class="k">"headline"</span>: …</div></div>
          <div class="row"><b>Live URLs</b><svg class="go"><use href="#ic-arrow-right"/></svg><div class="thumb t-url"><span class="dot"></span>brightloop.app/blog</div></div>
          <div class="row"><b>Settings</b><svg class="go"><use href="#ic-arrow-right"/></svg></div>
        </div>
      </div>
    </div>
    <div class="foot" data-only="4x5"><span>Up to date · 8 articles</span><div class="sync">Sync articles</div></div>
  </div>

  <svg class="cursor" viewBox="0 0 32 32"><use href="#ic-cursor"/></svg>
</div>
<script>
  // Dashed leads from under each logo to the panel's edge.
  addEventListener("load", () => {
    const c = document.querySelector(".canvas").getBoundingClientRect();
    const svg = document.getElementById("dash");
    svg.setAttribute("viewBox", `0 0 ${c.width} ${c.height}`);
    const r = (sel) => { const b = document.querySelector(sel).getBoundingClientRect(); return { x: b.left - c.left, y: b.top - c.top, w: b.width, h: b.height }; };
    const L = r(".logo-l"), R = r(".logo-r"), P = r(".lpanel");
    document.getElementById("dl").setAttribute("d", `M${L.x + 114} ${L.y + 304} L ${P.x - 4} ${L.y + 492}`);
    document.getElementById("dr").setAttribute("d", `M${R.x + 124} ${R.y + 316} L ${P.x + P.w + 6} ${R.y + 504}`);
  });
</script>
</body>
</html>
