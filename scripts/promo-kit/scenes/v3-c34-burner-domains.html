<!doctype html>
<!-- Variant 3 · Cluster 34 "Burner domains" (cold email), one image.
     "Selected", sky field. The outbound grind as a row of envelopes drawn in
     blue line: burner domains #1 and #2 singed, struck and smoking, #3 still
     warming on day 21, and the one reply it earned, "Please stop emailing
     me." The selected thing is the turn itself: "easier" in the headline.
     The close says where the buyers went. The send counter is a UI stand-in
     (as in variant 1), not a stat. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="formats" content="4x5" />
<link rel="stylesheet" href="../kit/kit.css" />
<link rel="stylesheet" href="ads3/ads3.css" />
<script src="../kit/kit.js"></script>
<script src="ads/ads.js"></script>
<script src="ads3/ads3.js"></script>
<style>
  .y34-top { position: absolute; left: 100px; right: 100px; top: 96px; display: flex; align-items: center; }
  .y34-top .v3-kick { margin-left: auto; }
  .y34-hl { position: absolute; left: 94px; right: 60px; top: 218px; font-size: 168px; line-height: 1.04; text-wrap: nowrap; }
  .y34-hl .v3-pick { line-height: 0.8; padding: 0.04em 0.07em 0.1em; margin: 0 0.14em 0 0.02em; --k: 0.13em; --st: 0.024em; }

  .y34-draw { position: absolute; left: 0; top: 0; width: 1600px; height: 2000px; pointer-events: none; overflow: visible; }

  .y34-lab { position: absolute; width: 420px; }
  .y34-lab b { display: block; font-size: 36px; font-weight: 720; letter-spacing: -0.025em; color: var(--v3-ink); }
  .y34-lab.burnt b { color: var(--v3-soft); }
  .y34-lab.burnt span { color: var(--v3-blue); }
  .y34-lab span { display: block; margin-top: 10px; font-size: 28px; font-weight: 600; letter-spacing: -0.01em; color: var(--v3-ink-2); }
  .y34-bar { margin-top: 16px; width: 360px; height: 14px; border-radius: 7px; background: var(--v3-sky-2); overflow: hidden; }
  .y34-bar i { display: block; width: 75%; height: 100%; border-radius: 7px; background: var(--v3-blue); }

  /* the reply */
  .y34-reply { position: absolute; left: 560px; top: 1330px; width: 940px; padding: 40px 50px 46px; background: #fff; border-radius: 40px; box-shadow: inset 0 0 0 5px var(--v3-blue), var(--v3-shadow); }
  .y34-tail { position: absolute; right: 150px; top: -58px; width: 80px; height: 64px; overflow: visible; }
  .y34-reply small { display: flex; align-items: center; gap: 14px; font-size: 28px; font-weight: 600; color: var(--v3-ink-2); }
  .y34-reply small svg { width: 32px; height: 32px; color: var(--v3-blue); }
  .y34-reply small b { color: var(--v3-ink); font-weight: 750; }
  .y34-reply p { margin-top: 18px; font-size: 76px; font-weight: 780; letter-spacing: -0.045em; line-height: 1; color: var(--v3-ink); }

  .y34-count { position: absolute; left: 100px; top: 1400px; width: 400px; padding: 28px 32px 30px; border-radius: 28px; background: #fff; box-shadow: inset 0 0 0 3px var(--v3-line); }
  .y34-count span { display: flex; align-items: center; gap: 12px; font-size: 28px; font-weight: 600; color: var(--v3-ink-2); }
  .y34-count span svg { width: 30px; height: 30px; color: var(--v3-blue); }
  .y34-count b { display: block; margin-top: 10px; font-size: 64px; font-weight: 780; letter-spacing: -0.045em; line-height: 1; color: var(--v3-ink); }
</style>
</head>
<body>
<div class="canvas v3 sky">
  <div class="v3-wash"></div>
  <div class="v3-dots"></div>

  <div class="y34-top">
    <span class="v3-logo"><svg><use href="#lg-rankbox"/></svg>Rankbox</span>
    <span class="v3-kick">The outbound grind</span>
  </div>
  <h1 class="v3-hl y34-hl">There’s an<br /><span class="v3-pick">easier</span>pipeline.</h1>
  <i class="v3-cur" style="left:556px; top:588px"></i>

  <svg class="y34-draw" viewBox="0 0 1600 2000" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- #1 and #2 burned: singed corner, soft blue, one blue strike each -->
    <g transform="translate(100 820)" stroke="var(--v3-soft)">
      <path d="M24 0 H396 Q420 0 420 24 V168 L398 182 L410 202 L384 210 L392 234 L364 240 L370 262 L342 280 H24 Q0 280 0 256 V24 Q0 0 24 0 Z" fill="#fff" stroke="none" />

      <path d="M16 14 L210 156 L404 14" />
      <path d="M446 176 q18 -22 0 -44 q-18 -22 0 -44 q18 -22 0 -44" stroke-width="5" />
      <path d="M22 206 L398 104" stroke="var(--v3-blue)" stroke-width="12" />
    </g>
    <g transform="translate(590 820)" stroke="var(--v3-soft)">
      <path d="M24 0 H396 Q420 0 420 24 V150 L402 166 L414 188 L388 196 L398 222 L370 228 L378 252 L350 258 L354 280 H24 Q0 280 0 256 V24 Q0 0 24 0 Z" fill="#fff" stroke="none" />
      <path d="M420 90 L420 150 L402 166 L414 188 L388 196 L398 222 L370 228 L378 252 L350 258 L354 280 L284 280 L312 254 L308 232 L336 226 L328 202 L356 196 L346 170 L372 162 L360 140 L378 124 Z" fill="var(--v3-sky-2)" stroke="none" />
      <path d="M24 0 H396 Q420 0 420 24 V150 L402 166 L414 188 L388 196 L398 222 L370 228 L378 252 L350 258 L354 280 H24 Q0 280 0 256 V24 Q0 0 24 0 Z" />
      <path d="M16 14 L210 156 L404 14" />
      <path d="M446 176 q18 -22 0 -44 q-18 -22 0 -44 q18 -22 0 -44" stroke-width="5" />
      <path d="M22 206 L398 104" stroke="var(--v3-blue)" stroke-width="12" />
    </g>
    <!-- #3 warming: intact, heat rising -->
    <g transform="translate(1080 820)" stroke="var(--v3-blue)">
      <rect x="0" y="0" width="420" height="280" rx="24" fill="#fff" />
      <path d="M16 14 L210 156 L404 14" />
      <path d="M150 -30 q-16 -20 0 -40 q16 -20 0 -40" stroke-width="5" />
      <path d="M210 -30 q-16 -20 0 -40 q16 -20 0 -40" stroke-width="5" />
      <path d="M270 -30 q-16 -20 0 -40 q16 -20 0 -40" stroke-width="5" />
    </g>
  </svg>

  <div class="y34-lab burnt" style="left:100px; top:1140px"><b>burner domain #1</b><span>Burned</span></div>
  <div class="y34-lab burnt" style="left:590px; top:1140px"><b>burner domain #2</b><span>Burned</span></div>
  <div class="y34-lab" style="left:1080px; top:1140px"><b>burner domain #3</b><span>Warming · day 21</span><div class="y34-bar"><i></i></div></div>

  <div class="y34-count"><span><svg><use href="#ic-send"/></svg>Sent this week</span><b>4,800</b></div>

  <div class="y34-reply">
    <svg class="y34-tail" viewBox="0 0 80 64"><rect x="2.5" y="56" width="73" height="10" fill="#fff" /><path d="M0 61.5 L64 2 L76 61.5" fill="#fff" stroke="var(--v3-blue)" stroke-width="5" stroke-linejoin="round" /></svg>
    <small><svg><use href="#ic-mail"/></svg><b>New reply</b> · Re: Quick question</small>
    <p>“Please stop emailing&nbsp;me.”</p>
  </div>

  <div class="v3-close">
    <svg class="mk"><use href="#lg-rankbox"/></svg>
    <p>Meanwhile, buyers ask AI which tool to use. Rankbox writes the&nbsp;answers.<span data-offer="line"></span></p>
    <div class="v3-go"><span data-offer="cta"></span><svg><use href="#ic-arrow-right"/></svg></div>
  </div>
</div>
</body>
</html>
