<!doctype html>
<!-- Variant 4 · Cluster 15 "The press release nobody read", one image.
     Replica of Dexter ("Know exactly how much you are spending per prompt"):
     a diagonal wash (bright at the top right, deep through the middle, bright
     again at the bottom left), a small lockup row where Dexter's app icons
     sit, a four-line semibold white headline on the left, and a tall history
     panel tilted ~13° that bleeds off the top right and the bottom. Dark
     made light: a brand-blue wash and a white panel. The panel is this
     billing cycle's articles on yoursite.com, each row the article credit it
     used; the plan row says what the month costs. Rows show credits, never a
     price per article (FACTS: Plan). The one number, $850+, sits under the
     headline with its source line. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="formats" content="4x5" />
<link rel="stylesheet" href="../kit/kit.css" />
<link rel="stylesheet" href="ads4/ads4.css" />
<script src="../kit/kit.js"></script>
<script src="ads/ads.js"></script>
<script src="ads4/ads4.js"></script>
<style>
  /* Dexter's diagonal: light top right, deep middle, light bottom left. */
  .y15-field { position: absolute; inset: 0; z-index: -3;
    background:
      radial-gradient(70% 45% at 100% 0%, rgba(140, 196, 255, 0.85) 0%, rgba(140, 196, 255, 0) 72%),
      radial-gradient(60% 40% at 0% 100%, rgba(110, 176, 255, 0.75) 0%, rgba(110, 176, 255, 0) 75%),
      linear-gradient(to bottom left, #4a9bff 0%, #2a7ff4 30%, #1667e0 55%, #1a6de6 78%, #3a8cf8 100%); }

  .y15-lock { left: 100px; top: 500px; }
  /* Dexter's logo tile, flush in the corner */
  .y15-corner { position: absolute; left: 0; top: 0; width: 104px; height: 104px; background: #0b57d0; color: #fff; display: grid; place-items: center; }
  .y15-corner svg { width: 58px; height: 58px; }
  .y15-lock .wm { font-size: 54px; }
  .y15-lock .wm svg { width: 60px; height: 60px; }

  .y15-hl { position: absolute; left: 94px; top: 660px; font-size: 120px; font-weight: 650; letter-spacing: -0.05em; word-spacing: 0.04em; line-height: 1.0; color: #fff; }

  .y15-num { position: absolute; left: 100px; top: 1218px; width: 520px; font-size: 38px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.2; color: rgba(255, 255, 255, 0.9); }
  .y15-num b { display: block; margin-top: 6px; font-size: 78px; font-weight: 700; letter-spacing: -0.045em; line-height: 1.05; color: #fff; }
  .y15-num small { display: block; margin-top: 18px; width: 490px; font-size: 25px; line-height: 1.36; font-weight: 500; letter-spacing: 0; color: rgba(255, 255, 255, 0.74); }

  /* the history panel, tilted */
  .y15-panel { position: absolute; left: 950px; top: 30px; width: 1040px; height: 2400px;
    transform: rotate(13deg); transform-origin: 0 0;
    border-radius: 30px; overflow: hidden; background: #fff; color: var(--v4-ink);
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.6), 0 60px 120px -30px rgba(4, 40, 130, 0.55), 0 20px 44px -16px rgba(4, 40, 130, 0.35); }
  .y15-top { position: absolute; left: 34px; top: 44px; display: flex; align-items: baseline; gap: 20px; white-space: nowrap; }
  .y15-top b { font-size: 44px; font-weight: 700; letter-spacing: -0.03em; }
  .y15-top span { font-size: 31px; font-weight: 500; letter-spacing: -0.01em; color: var(--v4-ink-2); }

  .y15-rows { position: absolute; left: 18px; top: 128px; width: 880px; display: grid; gap: 10px; }
  .y15-row { display: flex; align-items: center; gap: 22px; height: 114px; padding: 0 22px 0 30px; border-radius: 22px;
    background: #f5f7fa; box-shadow: inset 0 0 0 1.5px #edf0f4; white-space: nowrap; }
  .y15-row .t { flex: none; max-width: 410px; overflow: hidden; text-overflow: ellipsis; font-size: 39px; font-weight: 550; letter-spacing: -0.02em; color: var(--v4-ink); }
  .y15-row .m { flex: none; font-size: 32px; font-weight: 500; letter-spacing: -0.01em; color: #8a909c; }
  .y15-row .c { margin-left: auto; flex: none; height: 58px; padding: 0 18px; border-radius: 14px; display: grid; place-items: center;
    background: #fff; box-shadow: inset 0 0 0 2px #e3e7ee; font-size: 29px; font-weight: 650; color: #3a4150; font-variant-numeric: tabular-nums; }
  .y15-row.plan { background: var(--v4-tint); box-shadow: inset 0 0 0 2px #b9d6fd; }
  .y15-row.plan .p { font-size: 34px; font-weight: 500; letter-spacing: -0.015em; color: #4a5a78; }
  .y15-row.plan .p b { font-weight: 700; color: var(--v4-ink); }
  .y15-row.plan .p i { font-style: normal; margin: 0 12px; color: #8aa0bf; }
  .y15-row.foot { background: transparent; box-shadow: none; }
  .y15-row.foot .m { color: var(--v4-ink-2); }
</style>
</head>
<body>
<div class="canvas v4">
  <div class="y15-field"></div>
  <div class="grain" style="--grain:.08"></div>
  <div class="y15-corner"><svg><use href="#lg-rankbox"/></svg></div>

  <div class="v4-lock y15-lock">
    <span class="wm"><svg><use href="#lg-rankbox"/></svg>Rankbox</span>
    <span class="v4-pill"><svg><use href="#ic-sparkle"/></svg><span data-offer="trial"></span></span>
  </div>

  <h1 class="y15-hl">One press<br />release, or a<br />month of<br />articles?</h1>

  <p class="y15-num">One national wire release:<b>$850+</b><small>Source: published national wire list prices, 400-word release, 2025</small></p>

  <div class="y15-panel">
    <div class="y15-top"><b>This cycle</b><span>12 of 30 articles · Business</span></div>
    <div class="y15-rows" id="rows">
      <div class="y15-row plan"><span class="p">Plan<i>·</i><b>$49.50 a month</b><i>·</i>30 articles</span></div>
    </div>
  </div>
</div>
<script>
  // This cycle on yoursite.com (a small-team planning tool), newest first:
  // 12 of 30 article credits used, about three a week. Each row is the
  // credit it used; no row carries a price.
  const rows = [
    ["How to Plan a Sprint Without Jira", "2d"],
    ["Taskwren Alternatives for Small Teams", "4d"],
    ["Kanban vs Scrum for a Team of Five", "6d"],
    ["How to Replace Standups With a Daily Digest", "9d"],
    ["What Is Capacity Planning?", "11d"],
    ["How to Write a Project Brief", "13d"],
    ["The Best Free Planning Tools for Startups", "16d"],
    ["How to Set Quarterly Goals as a Small Team", "18d"],
    ["Gantt Chart or Timeline View?", "20d"],
    ["How to Run a Project Retrospective", "23d"],
    ["How Do I Prioritize a Team Backlog?", "25d"],
    ["How Many Projects Can a Small Team Run?", "27d"],
  ];
  const host = document.getElementById("rows");
  for (const [t, d] of rows) {
    host.insertAdjacentHTML("beforeend",
      `<div class="y15-row"><span class="t">${t}</span><span class="m">Published · ${d} ago</span><span class="c">1 credit</span></div>`);
  }
  host.insertAdjacentHTML("beforeend",
    `<div class="y15-row foot"><span class="m">Writing uses 1 article credit · 18 left this month</span></div>`);
</script>
</body>
</html>
