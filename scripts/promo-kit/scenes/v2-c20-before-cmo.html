<!doctype html>
<!-- Variant 2 · Cluster 20 "Before you hire a fractional CMO", one image.
     Cal.com family (33–35): near-black frame, one calm dark widget card, the
     soft wall of tiles across its head with a few lit in brand blue, the
     wordmark centred at the foot. The card holds the editorial quote (the
     spec's exact words, no attribution, "Advice for founders" as caption), a
     quiet week strip under it (the "one week"), and its own footer row as the
     close: the turn, the offer and a blue button. Rankbox is named once, in
     the foot wordmark. $8,000 is the spec's framing, used exactly as in
     variant 1 and nowhere else. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="formats" content="4x5" />
<link rel="stylesheet" href="../kit/kit.css" />
<link rel="stylesheet" href="ads2/ads2.css" />
<script src="../kit/kit.js"></script>
<script src="ads/ads.js"></script>
<script src="ads2/ads2.js"></script>
<style>
  html, body { background: #000; }
  .canvas.v2.y20 { background: #000; color: #f2f2f3; }
  .y20-frame { position: absolute; inset: 0; z-index: -2; border-radius: 40px; background: radial-gradient(80% 50% at 50% 0%, #17181b 0%, #111112 60%); box-shadow: inset 0 0 0 2px #1c1c1e; }
  .canvas.v2.y20 .grain { --grain: 0.05; }

  /* ------------------------------------------------ the widget */
  .y20-card { position: absolute; left: 110px; right: 110px; top: 186px; border-radius: 36px; background: #161617; overflow: hidden;
    box-shadow: inset 0 0 0 2px #262628, 0 60px 140px -50px rgba(0, 0, 0, 0.95); }

  /* the head: a soft wall of tiles, a few lit blue, fading down */
  .y20-strip { position: absolute; left: 12px; right: 12px; top: 12px; height: 262px; padding: 9px; border-radius: 26px; background: #1c1c1e; overflow: hidden;
    display: grid; grid-template-columns: repeat(12, 1fr); grid-auto-rows: 76px; gap: 9px;
    -webkit-mask-image: linear-gradient(180deg, #000 30%, transparent 96%); mask-image: linear-gradient(180deg, #000 30%, transparent 96%); }
  .y20-strip i { border-radius: 16px; background: #262628; }
  .y20-strip i.b { background: #1d4f9c; }
  .y20-strip i.b2 { background: #2a6ad0; }

  .y20-body { position: relative; padding: 184px 76px 0; }
  .y20-tile { width: 112px; height: 112px; border-radius: 28px; background: #fff; display: grid; place-items: center; box-shadow: 0 0 0 6px #161617; }
  .y20-tile span { font-family: "Iowan Old Style", Georgia, serif; font-size: 150px; line-height: 1; height: 66px; color: var(--blue); }
  .y20-cap { margin-top: 30px; font-size: 34px; font-weight: 500; color: #a1a1a6; letter-spacing: -0.01em; }
  .y20-quote { margin-top: 18px; font-family: "Iowan Old Style", Georgia, serif; font-size: 90px; font-weight: 400; line-height: 1.14; letter-spacing: -0.014em; color: #f4f5f7; text-wrap: balance; }
  .y20-quote em { font-style: italic; color: #fff; }

  /* one week, as a range in a calendar */
  .y20-week { margin-top: 50px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
  .y20-week .dow { height: 36px; display: grid; place-items: center; font-size: 25px; font-weight: 500; letter-spacing: 0.06em; color: #8e8e93; }
  .y20-week .d { position: relative; height: 86px; display: grid; place-items: center; border-radius: 18px; background: #14335f; font-size: 33px; font-weight: 600; color: #fff; }
  .y20-week .d.pick { background: #fff; color: #0c0c0d; }

  /* the widget's footer row is the close */
  .y20-foot { margin-top: 56px; padding: 44px 76px 48px; border-top: 2px solid #262628; display: grid; grid-template-columns: 1fr auto; column-gap: 40px; row-gap: 26px; align-items: center; }
  .y20-foot p { grid-column: 1 / -1; font-size: 40px; font-weight: 500; line-height: 1.3; letter-spacing: -0.02em; color: #b4b4ba; }
  .y20-foot p b { color: #fff; font-weight: 700; }
  .y20-offer { font-size: 29px; font-weight: 500; color: #8e8e93; letter-spacing: -0.01em; white-space: nowrap; }
  .y20-foot .v2-go { box-shadow: 0 18px 34px -14px rgba(24, 119, 242, 0.75); }

  .y20-mark { position: absolute; left: 0; right: 0; bottom: 104px; display: flex; justify-content: center; }
  .y20-mark .wm { font-size: 56px; color: #fff; }
</style>
</head>
<body>
<div class="canvas v2 y20">
  <div class="y20-frame"></div>
  <div class="grain"></div>

  <div class="y20-card">
    <div class="y20-strip" id="strip"></div>
    <div class="y20-body">
      <div class="y20-tile"><span>“</span></div>
      <div class="y20-cap">Advice for founders</div>
      <blockquote class="y20-quote">Before you spend $8,000&nbsp;a&nbsp;month on a fractional CMO to fix organic growth, spend <em>one&nbsp;week</em> finding out what’s already possible.</blockquote>
      <div class="y20-week" id="week"></div>
    </div>
    <div class="y20-foot">
      <p><b>One week on autopilot first.</b> If you still hire the CMO, they start with an engine already running.</p>
      <span class="y20-offer" data-offer="line"></span>
      <div class="v2-go"><span data-offer="cta"></span><svg><use href="#ic-arrow-right"/></svg></div>
    </div>
  </div>

  <div class="y20-mark"><span class="wm"><svg><use href="#lg-rankbox"/></svg>Rankbox</span></div>
</div>
<script>
  // The head strip: a soft wall of tiles, a few lit in brand blue (Cal.com).
  const strip = document.getElementById("strip");
  const lit = { 3: "b", 8: "b2", 16: "b", 21: "b2", 27: "b", 34: "b" };
  for (let i = 0; i < 36; i++) strip.insertAdjacentHTML("beforeend", `<i class="${lit[i] || ""}"></i>`);
  // One week: seven days selected as a range, the first one picked.
  const week = document.getElementById("week");
  ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"].forEach((d) => week.insertAdjacentHTML("beforeend", `<div class="dow">${d}</div>`));
  for (let d = 1; d <= 7; d++) week.insertAdjacentHTML("beforeend", `<div class="d${d === 1 ? " pick" : ""}">${d}</div>`);
</script>
</body>
</html>
