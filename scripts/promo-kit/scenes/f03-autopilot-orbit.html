<!doctype html>
<!-- f03 · Get AI traffic on autopilot. Freestyle, universal: no business type,
     no sample site. The landing hero's bright brand-blue field and drifting
     white squares; ten answer engines on white tiles orbiting the Settings
     page's own Autopilot section ("Whether it writes, and how often.",
     "Write automatically" switched on, "On — writing every day", the Pace
     buttons); and the hero's URL form ending on "Get Started Free". No dark
     element anywhere: marks that are black in their own logos are left out
     or shown in the site's own colour for them (ChatGPT green, as
     ai-logos.tsx draws it). Formats: 4x5 feed, 9x16 Reel. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="formats" content="4x5 9x16" />
<link rel="stylesheet" href="../kit/kit.css" />
<script src="../kit/kit.js"></script>
<style>
  .canvas { background: #1877f2; }
  .f3-field {
    position: absolute; inset: 0; z-index: -2;
    background:
      radial-gradient(70% 40% at 50% 26%, rgba(150, 205, 255, 0.55) 0%, rgba(150, 205, 255, 0) 70%),
      radial-gradient(60% 34% at 50% 62%, rgba(110, 185, 255, 0.45) 0%, rgba(110, 185, 255, 0) 72%),
      radial-gradient(90% 50% at 0% 100%, rgba(18, 98, 222, 0.75) 0%, rgba(18, 98, 222, 0) 70%),
      radial-gradient(90% 50% at 100% 100%, rgba(18, 98, 222, 0.75) 0%, rgba(18, 98, 222, 0) 70%),
      #1877f2;
  }
  .grain { --grain: 0.1; }
  .f3-px { position: absolute; inset: 0; z-index: -1; pointer-events: none; }
  .f3-px i { position: absolute; display: block; background: #fff; border-radius: 3px; }

  /* logo: the white mark, no tile */
  .f3-logo { position: absolute; left: 0; right: 0; top: var(--logo-y, 104px); display: flex; justify-content: center; align-items: center; gap: 18px; color: #fff; font-size: 52px; font-weight: 600; letter-spacing: -0.03em; }
  .f3-logo svg { width: 56px; height: 56px; }

  .f3-hl { position: absolute; left: 0; right: 0; top: var(--hl-y, 200px); text-align: center; color: #fff; font-size: 172px; font-weight: 700; letter-spacing: -0.052em; line-height: 0.98; word-spacing: 0.02em; text-shadow: 0 10px 40px rgba(10, 70, 190, 0.25); }
  .f3-sub { position: absolute; left: 0; right: 0; top: var(--sub-y, 568px); text-align: center; color: rgba(255, 255, 255, 0.9); font-size: 42px; font-weight: 500; letter-spacing: -0.02em; }

  /* the orbit */
  .f3-orbit { position: absolute; left: 0; top: 0; width: 1600px; height: var(--h); pointer-events: none; overflow: visible; }
  .f3-t {
    position: absolute; width: var(--s); height: var(--s); margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2);
    border-radius: 25%; background: #fff; display: grid; place-items: center;
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.7), 0 calc(var(--s) * 0.16) calc(var(--s) * 0.3) calc(var(--s) * -0.1) rgba(6, 60, 170, 0.45);
  }
  .f3-t > svg, .f3-t > img { width: 56%; height: 56%; display: block; }
  .f3-t.chatgpt { color: #10a37f; }
  .f3-t.claude { color: #d97757; }
  .f3-t.perplexity { color: #20808d; }
  .f3-t.deepseek { color: #4d6bfe; }
  .f3-t.bing { color: #0078d4; }

  /* the Autopilot section, as Settings draws it */
  .f3-card {
    position: absolute; left: 50%; top: var(--card-y, 770px); width: 940px; margin-left: -470px; z-index: 5;
    border-radius: 44px; background: #fff; color: var(--ink); padding: 48px 56px 52px;
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.8), 0 60px 110px -40px rgba(6, 50, 150, 0.6), 0 24px 50px -26px rgba(6, 50, 150, 0.45);
  }
  .f3-h { display: flex; align-items: center; gap: 24px; }
  .f3-h .ic { width: 88px; height: 88px; border-radius: 26px; background: #e8f1ff; color: var(--blue); display: grid; place-items: center; flex: none; }
  .f3-h .ic svg { width: 50px; height: 50px; }
  .f3-h b { display: block; font-size: 52px; font-weight: 750; letter-spacing: -0.035em; }
  .f3-h span { display: block; margin-top: 4px; font-size: 31px; font-weight: 500; color: #7d838f; letter-spacing: -0.012em; }
  .f3-row { margin-top: 34px; padding-top: 34px; border-top: 2px solid #eef0f3; }
  .f3-row .lab { font-size: 34px; font-weight: 650; letter-spacing: -0.02em; color: #12161f; }
  .f3-sw { margin-top: 20px; display: flex; align-items: center; gap: 22px; font-size: 32px; font-weight: 500; color: #12161f; }
  .f3-switch { position: relative; width: 132px; height: 76px; border-radius: 999px; background: var(--blue); flex: none; box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.04), 0 10px 24px -10px rgba(22, 111, 229, 0.8); }
  .f3-switch::after { content: ""; position: absolute; right: 7px; top: 7px; width: 62px; height: 62px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(6, 40, 110, 0.3); }
  .f3-pace { margin-top: 20px; display: flex; flex-wrap: nowrap; gap: 12px; }
  .f3-pace span { height: 66px; padding: 0 28px; border-radius: 999px; display: grid; place-items: center; font-size: 28px; font-weight: 600; color: #7d838f; box-shadow: inset 0 0 0 2px #e4e7ec; white-space: nowrap; }
  .f3-pace span.on { background: var(--blue); color: #fff; box-shadow: 0 8px 18px -8px rgba(22, 111, 229, 0.8); }

  /* the hero's URL form */
  .f3-form {
    position: absolute; left: 50%; top: var(--form-y, 1704px); width: 1040px; margin-left: -520px; height: 132px; z-index: 6;
    display: flex; align-items: center; gap: 18px; padding: 0 14px 0 40px; border-radius: 36px; background: #fff;
    box-shadow: 0 0 0 8px rgba(255, 255, 255, 0.22), 0 40px 80px -30px rgba(6, 50, 150, 0.55);
  }
  .f3-form > svg { width: 46px; height: 46px; color: #8a909c; flex: none; }
  .f3-form .u { flex: 1; font-size: 44px; font-weight: 550; letter-spacing: -0.02em; color: #12161f; display: flex; align-items: center; }
  .f3-form .u i { width: 3px; height: 52px; margin-left: 4px; background: var(--blue); border-radius: 2px; }
  .f3-form .go { height: 104px; padding: 0 44px; border-radius: 26px; background: var(--blue); color: #fff; display: grid; place-items: center; font-size: 40px; font-weight: 650; letter-spacing: -0.02em; white-space: nowrap; }

  /* a white cursor, so nothing in the frame is dark */
  .f3-cur { position: absolute; z-index: 20; width: 104px; height: 104px; filter: drop-shadow(0 12px 16px rgba(6, 50, 150, 0.4)); }

  /* Reel: everything inside Instagram's safe area */
  html[data-f="9x16"] { --logo-y: 360px; --hl-y: 452px; --sub-y: 826px; --card-y: 1110px; --form-y: 2088px; }
  html[data-f="9x16"] .f3-field {
    background:
      radial-gradient(80% 26% at 50% 22%, rgba(150, 205, 255, 0.55) 0%, rgba(150, 205, 255, 0) 70%),
      radial-gradient(70% 24% at 50% 52%, rgba(110, 185, 255, 0.45) 0%, rgba(110, 185, 255, 0) 72%),
      radial-gradient(90% 34% at 0% 100%, rgba(18, 98, 222, 0.75) 0%, rgba(18, 98, 222, 0) 70%),
      radial-gradient(90% 34% at 100% 100%, rgba(18, 98, 222, 0.75) 0%, rgba(18, 98, 222, 0) 70%),
      #1877f2;
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="f3-field"></div>
  <div class="f3-px" id="px"></div>
  <div class="grain"></div>

  <div class="f3-logo"><svg><use href="#lg-rankbox"/></svg>Rankbox</div>
  <h1 class="f3-hl">Get AI traffic<br />on autopilot</h1>
  <p class="f3-sub">For SaaS, local businesses and online stores.</p>

  <svg class="f3-orbit" id="rings"></svg>
  <div id="tiles"></div>

  <div class="f3-card" id="card">
    <div class="f3-h">
      <span class="ic"><svg><use href="#rb-autopilot"/></svg></span>
      <div><b>Autopilot</b><span>Whether it writes, and how often.</span></div>
    </div>
    <div class="f3-row">
      <div class="lab">Write automatically</div>
      <div class="f3-sw"><span class="f3-switch" id="switch"></span>On — writing every day</div>
    </div>
    <div class="f3-row">
      <div class="lab">Pace</div>
      <div class="f3-pace"><span class="on">Every day</span><span>5 a week</span><span>3 a week</span><span>1 a week</span></div>
    </div>
  </div>

  <div class="f3-form"><svg><use href="#ic-globe"/></svg><span class="u">yoursite.com<i></i></span><span class="go">Get Started Free</span></div>

  <svg class="f3-cur" id="cur" viewBox="0 0 32 32"><path d="M5 3l22 10.5-9.6 2.6L12.6 26z" fill="#fff" stroke="#0b5ed7" stroke-width="2.4" stroke-linejoin="round"/></svg>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- Bing, as src/components/landing/ai-logos.tsx draws it -->
    <symbol id="f3-bing" viewBox="0 0 24 24"><path fill="currentColor" d="M5.11 1.56v18.39l4.44 2.49 9.34-5.35v-4.22L10.5 9.59l1.54 3.84 2.66 1.25-5.14 2.95V3.11z"/></symbol>
  </defs>
</svg>

<script>
  // The landing hero's pixel field: fixed coordinates, white squares.
  const PX = [
    [3,31,14,.10],[7,66,20,.08],[11,9,22,.12],[5,88,16,.09],[16,48,12,.07],[14,79,24,.11],[9,20,10,.07],
    [27,3,26,.13],[31,94,18,.10],[24,70,12,.07],[38,58,22,.09],[44,88,14,.08],[41,16,10,.06],[52,2,20,.11],
    [49,97,24,.12],[63,7,24,.14],[68,35,16,.10],[72,62,26,.12],[66,84,14,.09],[79,18,28,.15],[83,47,18,.11],
    [77,73,22,.13],[86,91,26,.14],[90,5,20,.12],[88,29,14,.09],[93,56,24,.13],[91,68,16,.10],[95,81,22,.12],
    [97,13,18,.11],[58,44,10,.06],[20,36,12,.08],[35,77,16,.10],
  ];
  document.getElementById("px").innerHTML = PX.map(([t, l, s, o]) =>
    `<i style="top:${t}%;left:${l}%;width:${s}px;height:${s}px;opacity:${o}"></i>`).join("");

  // Ten answer engines on one tilted orbit. Angles are picked so no tile hides
  // behind the card: the back of the ring shows only at its two ends.
  const ENGINES = [
    ["mistral", '<svg><use href="#lg-mistral"/></svg>', -150],
    ["meta", '<svg><use href="#lg-meta"/></svg>', 180],
    ["perplexity", '<svg><use href="#lg-perplexity"/></svg>', 154],
    ["gemini", '<img src="../kit/gemini.png" alt="" />', 128],
    ["chatgpt", '<svg><use href="#lg-chatgpt"/></svg>', 102],
    ["claude", '<svg><use href="#lg-claude"/></svg>', 78],
    ["google", '<svg><use href="#lg-google"/></svg>', 52],
    ["copilot", '<svg><use href="#lg-copilot"/></svg>', 26],
    ["deepseek", '<svg><use href="#lg-deepseek"/></svg>', 0],
    ["bing", '<svg><use href="#f3-bing"/></svg>', -30],
  ];

  document.fonts.ready.then(() => {
    const canvas = document.querySelector(".canvas").getBoundingClientRect();
    const card = document.getElementById("card").getBoundingClientRect();
    const cx = 800, cy = card.top - canvas.top + card.height * 0.62;
    const rx = 676, ry = 340, tilt = -6 * Math.PI / 180;
    const pt = (deg, k = 1) => {
      const a = deg * Math.PI / 180, x = rx * k * Math.cos(a), y = ry * k * Math.sin(a);
      return [cx + x * Math.cos(tilt) - y * Math.sin(tilt), cy + x * Math.sin(tilt) + y * Math.cos(tilt)];
    };

    // Rings: the orbit itself, and a fainter inner one for depth.
    const ring = (k, op, dash) => {
      const pts = [];
      for (let d = 0; d <= 360; d += 3) pts.push(pt(d, k).map((v) => v.toFixed(1)).join(" "));
      return `<path d="M${pts.join(" L")}Z" fill="none" stroke="#fff" stroke-opacity="${op}" stroke-width="3" ${dash ? 'stroke-dasharray="2 14" stroke-linecap="round"' : ""}/>`;
    };
    const rings = document.getElementById("rings");
    rings.setAttribute("viewBox", `0 0 1600 ${canvas.height}`);
    rings.innerHTML = ring(1, 0.42) + ring(0.8, 0.3, true) + ring(1.2, 0.18, true);

    // Tiles: nearer is bigger. The front half of the ring passes in front of
    // the card, the back half behind it.
    document.getElementById("tiles").innerHTML = ENGINES.map(([cls, mark, deg]) => {
      const [x, y] = pt(deg);
      const z = Math.sin(deg * Math.PI / 180);
      const s = Math.round(140 + 40 * z);
      const front = z > 0;
      const rot = Math.round(Math.cos(deg * Math.PI / 180) * -7);
      return `<div class="f3-t ${cls}" style="--s:${s}px;left:${x}px;top:${y}px;z-index:${front ? 8 : 2};transform:rotate(${rot}deg)">${mark}</div>`;
    }).join("");

    // The cursor rests on the switch's knob: autopilot, just turned on.
    const sw = document.getElementById("switch").getBoundingClientRect();
    const cur = document.getElementById("cur");
    cur.style.left = (sw.left - canvas.left + sw.width * 0.74) + "px";
    cur.style.top = (sw.top - canvas.top + sw.height * 0.58) + "px";
  });
</script>
</body>
</html>
