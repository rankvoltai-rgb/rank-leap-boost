<!doctype html>
<!-- QA sheet: every mark in the sprite as an app tile, round and square. Not a
     deliverable; render it after touching kit.js to check no path broke. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="formats" content="4x3" />
<link rel="stylesheet" href="./kit.css" />
<script src="./kit.js"></script>
<style>
  .canvas { background: #0b1220; padding: 60px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 40px; align-content: start; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 14px; color: #fff; font-size: 20px; }
  .pair { display: flex; gap: 14px; }
</style>
</head>
<body>
<div class="canvas" id="c"></div>
<script>
  const names = ["rankbox","chatgpt","claude","gemini","google","perplexity","copilot","grok","deepseek","meta","mistral","reddit","framer","webflow","wordpress","shopify","square"];
  const c = document.getElementById("c");
  for (const n of names) {
    const glyph = n === "gemini" ? '<img src="./gemini.png" alt="">' : `<svg><use href="#lg-${n}"/></svg>`;
    c.insertAdjacentHTML("beforeend", `<div class="cell"><div class="pair"><div class="app ${n} rim" style="--s:110px">${glyph}</div><div class="app round ${n} rim" style="--s:110px">${glyph}</div></div>${n}</div>`);
  }
</script>
</body>
</html>
